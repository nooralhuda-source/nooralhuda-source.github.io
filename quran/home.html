.content-card {

.content-card:hover::before {

<script>
// Scroll Progress Bar
window.addEventListener('scroll', () => {
  const scrolled = (window.scrollY / (document.documentElement.scrollHeight - window.innerHeight)) * 100;
  document.querySelector('.scroll-progress').style.width = scrolled + '%';
});

// Navbar scroll effect
window.addEventListener('scroll', () => {
  const navbar = document.querySelector('.navbar');
  if (window.scrollY > 100) {
    navbar.style.boxShadow = '0 4px 20px rgba(0, 0, 0, 0.1)';
  } else {
    navbar.style.boxShadow = 'none';
  }
});

// Hamburger Menu
const hamburger = document.getElementById('hamburger');
const navLinks = document.getElementById('navLinks');

if (hamburger) {
  hamburger.addEventListener('click', (e) => {
    e.stopPropagation();
    navLinks.classList.toggle('active');
    hamburger.classList.toggle('active');
    hamburger.textContent = navLinks.classList.contains('active') ? '✕' : '☰';
  });

  document.addEventListener('click', (e) => {
    if (!navLinks.contains(e.target) && !hamburger.contains(e.target)) {
      navLinks.classList.remove('active');
      hamburger.classList.remove('active');
      hamburger.textContent = '☰';
    }
  });

  navLinks.querySelectorAll('a').forEach(link => {
    link.addEventListener('click', () => {
      navLinks.classList.remove('active');
      hamburger.classList.remove('active');
      hamburger.textContent = '☰';
    });
  });
}

// State

// Elements
const grid = document.getElementById('contentGrid');
const searchInput = document.getElementById('searchInput');
const surahBtn = document.getElementById('surahBtn');
const juzBtn = document.getElementById('juzBtn');
const pageTitle = document.getElementById('pageTitle');

// Render Surahs
function renderSurahs() {
  grid.innerHTML = '';
  surahs.forEach(surah => {
    const card = document.createElement('div');
    card.className = 'content-card';
    card.innerHTML = `
      <h3>${surah.number}. ${surah.ar}</h3>
      <p style="font-size: 1.1rem; font-weight: 600;">${surah.trans}</p>
      <p style="font-size: 0.85rem; opacity: 0.7;">${surah.en}</p>
    `;
    card.addEventListener('click', () => {
      window.location.href = `./#${surah.number}`;
    });
    grid.appendChild(card);
  });
}

// Render Juz
function renderJuz() {
  grid.innerHTML = '';
  juzData.forEach(juz => {
    const card = document.createElement('div');
    card.className = 'content-card';
    card.innerHTML = `
      <h3>${juz.ar}</h3>
      <p style="font-size: 1.1rem; font-weight: 600;">${juz.en}</p>
    `;
    card.addEventListener('click', () => {
      window.location.href = `./?${juz.number}`;
    });
    grid.appendChild(card);
  });
}

// Toggle View
surahBtn.addEventListener('click', () => {
  currentView = 'surah';
  surahBtn.classList.add('active');
  juzBtn.classList.remove('active');
  pageTitle.textContent = 'Select a Surah';
  searchInput.placeholder = 'Search Surah...';
  renderSurahs();
});

juzBtn.addEventListener('click', () => {
  currentView = 'juz';
  juzBtn.classList.add('active');
  surahBtn.classList.remove('active');
  pageTitle.textContent = 'Select a Juz';
  searchInput.placeholder = 'Search Juz...';
  renderJuz();
});

// Search functionality
searchInput.addEventListener('input', (e) => {
  const query = e.target.value.toLowerCase().trim();
  const cards = grid.getElementsByClassName('content-card');
  
  Array.from(cards).forEach(card => {
    const text = card.textContent.toLowerCase();
    card.style.display = text.includes(query) ? '' : 'none';
  });
});

// Initial render
renderSurahs();

// Theme support
function applyThemeClass(isDark) {
  if (isDark) {
    document.body.classList.add('dark');
    document.body.classList.add('dark-mode');
  } else {
    document.body.classList.remove('dark');
    document.body.classList.remove('dark-mode');
  }
}

const savedTheme = localStorage.getItem('theme');
applyThemeClass(savedTheme === 'dark');
