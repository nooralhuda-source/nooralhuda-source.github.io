<!doctype html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quran Reader - Noor Al Huda</title>
  <link rel="icon" type="image/png" href="logo.png.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Amiri:wght@400;700&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300;1,400&display=swap" rel="stylesheet" />

  <style>
    /* =============================================
       1. DESIGN TOKENS — LIGHT THEME
    ============================================= */
    :root {
      --green:        #136f3c;
      --green-dark:   #0e5530;
      --green-light:  #e8f5ee;
      --gold:         #d4af37;
      --gold-light:   #fdf6dd;
      --bg:           #f7fafc;
      --surface:      #ffffff;
      --border:       #e2e8f0;
      --text:         #2d3748;
      --text-muted:   #718096;
      --text-faint:   #a0aec0;
      --shadow-sm:    0 1px 3px rgba(0,0,0,.08);
      --shadow-md:    0 4px 12px rgba(0,0,0,.10);
      --shadow-lg:    0 10px 30px rgba(0,0,0,.12);
      --radius-sm:    8px;
      --radius-md:    14px;
      --radius-lg:    20px;
      --radius-pill:  999px;
      --transition:   all .25s cubic-bezier(.4,0,.2,1);
      --bar-h:        58px;
    }

    /* =============================================
       2. DARK THEME OVERRIDES
    ============================================= */
    [data-theme="dark"] {
      --bg:           #0f1117;
      --surface:      #1a1f2e;
      --border:       #2d3748;
      --text:         #e2e8f0;
      --text-muted:   #a0aec0;
      --text-faint:   #718096;
      --green-light:  #0e2a1a;
      --gold-light:   #2a2210;
      --shadow-sm:    0 1px 3px rgba(0,0,0,.3);
      --shadow-md:    0 4px 12px rgba(0,0,0,.4);
      --shadow-lg:    0 10px 30px rgba(0,0,0,.5);
    }

    /* =============================================
       3. RESET & BASE
    ============================================= */
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      overflow-x: hidden;
      padding-bottom: calc(var(--bar-h) + 16px);
      transition: background .3s, color .3s;
    }

    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; cursor: pointer; }
    img { display: block; max-width: 100%; }

    /* =============================================
       4. CUSTOM FONTS
    ============================================= */
    @font-face {
      font-family: 'IndoPak';
      src: url('font.woff2') format('woff2');
      font-weight: normal; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: 'Kolkatta';
      src: url('Al Qalam Kolkatta Quranic font Regular.woff2') format('woff2');
      font-weight: normal; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: 'Uthmani';
      src: url('UthmanicHafs_V22.woff2') format('woff2');
      font-weight: normal; font-style: normal; font-display: swap;
    }

    /* =============================================
       5. NAVBAR
    ============================================= */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 900;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      transition: background .3s, border-color .3s;
    }
    .nav-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 1.5rem;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--green);
      letter-spacing: -.02em;
    }
    .nav-links {
      list-style: none;
      display: flex;
      gap: 2rem;
      align-items: center;
    }
    .nav-links a {
      font-size: .9rem;
      font-weight: 500;
      color: var(--text-muted);
      transition: color .2s;
    }
    .nav-links a:hover { color: var(--green); }
    .hamburger {
      display: none;
      background: none;
      border: none;
      font-size: 1.5rem;
      color: var(--green);
      padding: .25rem;
      line-height: 1;
    }

    /* mobile nav dropdown */
    .nav-dropdown {
      display: none;
      flex-direction: column;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 1rem 1.5rem 1.25rem;
      gap: .9rem;
      list-style: none;
    }
    .nav-dropdown.open { display: flex; }
    .nav-dropdown a {
      font-size: 1rem;
      font-weight: 500;
      color: var(--text);
      transition: color .2s;
    }
    .nav-dropdown a:hover { color: var(--green); }

    /* =============================================
       6. PAGE HEADER
    ============================================= */
    .page-header {
      background:
        linear-gradient(135deg, rgba(19,111,60,.92) 0%, rgba(14,85,48,.88) 100%),
        url('https://nooralhuda.co.uk/karbala.jpg') center / cover no-repeat;
      color: #fff;
      padding: 2.5rem 1.5rem 2rem;
      text-align: center;
      position: relative;
    }
    .header-inner {
      max-width: 980px;
      margin: 0 auto;
      position: relative;
    }
    .header-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      gap: .75rem;
    }
    .back-btn {
      background: rgba(255,255,255,.12);
      border: 1px solid rgba(255,255,255,.25);
      color: #fff;
      padding: .45rem 1rem;
      border-radius: var(--radius-pill);
      font-size: .85rem;
      font-weight: 600;
      transition: var(--transition);
      backdrop-filter: blur(8px);
    }
    .back-btn:hover { background: rgba(255,255,255,.22); }

    .header-action-group {
      display: flex;
      gap: .6rem;
    }
    .hdr-btn {
      background: rgba(255,255,255,.12);
      border: 1px solid rgba(255,255,255,.25);
      color: #fff;
      padding: .45rem 1rem;
      border-radius: var(--radius-pill);
      font-size: .85rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: .4rem;
      transition: var(--transition);
      backdrop-filter: blur(8px);
    }
    .hdr-btn:hover { background: rgba(255,255,255,.24); }

    .surah-title-ar {
      font-family: 'Amiri', serif;
      font-size: clamp(1.9rem, 5vw, 2.8rem);
      font-weight: 700;
      margin-bottom: .3rem;
      text-shadow: 0 2px 12px rgba(0,0,0,.25);
    }
    .surah-title-en {
      font-size: clamp(1rem, 2.5vw, 1.3rem);
      font-weight: 600;
      margin-bottom: .2rem;
      opacity: .95;
    }
    .surah-meta {
      font-size: .9rem;
      opacity: .8;
    }
    .resume-chip {
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      margin-top: .9rem;
      background: rgba(212,175,55,.18);
      border: 1px solid rgba(212,175,55,.4);
      color: #fff;
      padding: .4rem 1rem;
      border-radius: var(--radius-pill);
      font-size: .82rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
    }
    .resume-chip:hover { background: rgba(212,175,55,.3); }

    /* =============================================
       7. MAIN CONTENT AREA
    ============================================= */
    .main-content {
      max-width: 980px;
      margin: 0 auto;
      padding: 1.5rem 1rem 0;
    }

    /* =============================================
       8. MODE TOGGLE
    ============================================= */
    .mode-toggle {
      display: flex;
      background: var(--border);
      border-radius: var(--radius-pill);
      padding: 3px;
      width: fit-content;
      margin: 0 auto 1.5rem;
      gap: 2px;
    }
    .mode-btn {
      padding: .5rem 1.4rem;
      border: none;
      border-radius: var(--radius-pill);
      background: transparent;
      color: var(--text-muted);
      font-size: .88rem;
      font-weight: 600;
      transition: var(--transition);
    }
    .mode-btn.active {
      background: var(--surface);
      color: var(--green);
      box-shadow: var(--shadow-sm);
    }

    /* =============================================
       9. BISMILLAH
    ============================================= */
    #bismillahWrap {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0 auto 1.5rem;
      width: 100%;
    }
    #bismillahWrap img {
      display: block;
      max-width: 340px;
      width: 80%;
      margin: 0 auto;
      filter: drop-shadow(0 4px 16px rgba(0,0,0,.08));
    }
    [data-theme="dark"] #bismillahWrap img {
      filter: drop-shadow(0 4px 16px rgba(0,0,0,.4)) invert(1) brightness(1.8);
    }

    /* =============================================
       10. AYAH CARDS — TRANSLATION MODE
    ============================================= */
    #ayahContainer { padding-bottom: .5rem; }

    .quran-verse {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 4px solid var(--green);
      border-radius: var(--radius-md);
      padding: 1.5rem 1.25rem 1.25rem;
      margin-bottom: 1.1rem;
      position: relative;
      transition: box-shadow .2s, border-color .2s, transform .2s, background .3s;
      opacity: 0;
      transform: translateY(12px);
    }
    .quran-verse.revealed {
      opacity: 1;
      transform: translateY(0);
      transition: opacity .4s ease, transform .4s ease, box-shadow .2s, background .3s;
    }
    .quran-verse:hover {
      box-shadow: var(--shadow-md);
      border-left-color: var(--gold);
    }

    .ayah-number {
      display: inline-flex;
      align-items: center;
      gap: .35rem;
      background: var(--green-light);
      color: var(--green);
      border: 1px solid rgba(19,111,60,.2);
      padding: .28rem .75rem;
      border-radius: var(--radius-pill);
      font-size: .78rem;
      font-weight: 700;
      margin-bottom: 1rem;
      letter-spacing: .02em;
    }

    .ayah-arabic {
      direction: rtl;
      text-align: right;
      line-height: 2.3;
      margin-bottom: 1rem;
      color: var(--text);
      font-feature-settings: "liga" on, "calt" on;
      -webkit-font-smoothing: antialiased;
      word-spacing: normal;
      letter-spacing: normal;
    }

    .ayah-translation {
      font-family: 'Merriweather', serif;
      font-size: clamp(.88rem, 2vw, 1rem);
      line-height: 1.85;
      color: var(--text);
      margin-bottom: .4rem;
    }
    .translation-source {
      font-size: .78rem;
      color: var(--text-faint);
      font-style: italic;
      margin-bottom: .6rem;
    }

    /* Tafsir */
    .tafsir-btn {
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      padding: .38rem .85rem;
      border: 1.5px solid var(--green);
      border-radius: var(--radius-pill);
      background: transparent;
      color: var(--green);
      font-size: .8rem;
      font-weight: 600;
      margin-top: .5rem;
      transition: var(--transition);
    }
    .tafsir-btn:hover, .tafsir-btn.open {
      background: var(--green);
      color: #fff;
    }
    .tafsir-arrow { font-size: .65rem; transition: transform .3s; }
    .tafsir-btn.open .tafsir-arrow { transform: rotate(180deg); }

    .tafsir-body {
      max-height: 0;
      overflow: hidden;
      transition: max-height .4s ease, opacity .3s;
      opacity: 0;
    }
    .tafsir-body.open {
      max-height: 2400px;
      opacity: 1;
    }
    .tafsir-inner {
      margin-top: .9rem;
      padding: 1rem 1.1rem;
      background: var(--green-light);
      border-radius: var(--radius-sm);
      border-left: 3px solid var(--green);
    }
    .tafsir-label {
      font-size: .78rem;
      font-weight: 700;
      color: var(--green);
      text-transform: uppercase;
      letter-spacing: .06em;
      margin-bottom: .5rem;
    }
    .tafsir-text {
      font-family: 'Merriweather', serif;
      font-size: .88rem;
      line-height: 1.8;
      color: var(--text);
    }

    /* Ayah actions (three-dots) */
    .ayah-actions {
      position: absolute;
      top: .9rem;
      right: .9rem;
    }
    .dots-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: none;
      background: var(--bg);
      color: var(--text-muted);
      font-size: 1.3rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
      line-height: 1;
    }
    .dots-btn:hover { background: var(--border); color: var(--text); }

    .ayah-menu {
      position: absolute;
      top: 40px;
      right: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-lg);
      min-width: 190px;
      z-index: 400;
      overflow: hidden;
      opacity: 0;
      visibility: hidden;
      transform: translateY(-8px) scale(.97);
      transition: opacity .2s, transform .2s, visibility .2s;
    }
    .ayah-menu.open {
      opacity: 1;
      visibility: visible;
      transform: translateY(0) scale(1);
    }
    .menu-item {
      display: flex;
      align-items: center;
      gap: .75rem;
      padding: .75rem 1rem;
      border: none;
      background: none;
      width: 100%;
      text-align: left;
      font-size: .88rem;
      font-weight: 500;
      color: var(--text);
      transition: background .15s;
      border-bottom: 1px solid var(--border);
    }
    .menu-item:last-child { border-bottom: none; }
    .menu-item:hover { background: var(--bg); }
    .menu-icon { display: none; }

    /* Bookmark highlight */
    .bookmark-highlight {
      outline: 2.5px solid var(--gold) !important;
      outline-offset: 3px;
    }

    /* =============================================
       11. READING MODE — CONTINUOUS INLINE FLOW
    ============================================= */
    #ayahContainer.continuous-reading {
      direction: rtl;
      text-align: right;
      line-height: 2.9;
      padding: 1.25rem 1.75rem;
      background: var(--surface);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
    }
    #ayahContainer.continuous-reading .quran-verse {
      display: inline;
      padding: 0;
      margin: 0;
      border: none;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
      opacity: 1;
      transform: none;
    }
    #ayahContainer.continuous-reading .quran-verse:hover {
      box-shadow: none;
      transform: none;
    }
    #ayahContainer.continuous-reading .ayah-arabic {
      display: inline;
      line-height: inherit;
      margin: 0;
    }
    #ayahContainer.continuous-reading .ayah-number {
      display: inline-flex;
      vertical-align: middle;
      width: 2em;
      height: 2em;
      padding: 0;
      border-radius: 50%;
      background: var(--surface);
      border: 1.5px solid var(--green);
      color: var(--green);
      font-size: .68em;
      font-weight: 700;
      justify-content: center;
      align-items: center;
      margin: 0 .28em 0 .45em;
      white-space: nowrap;
      letter-spacing: 0;
    }
    #ayahContainer.continuous-reading .ayah-actions,
    #ayahContainer.continuous-reading .ayah-translation,
    #ayahContainer.continuous-reading .translation-source,
    #ayahContainer.continuous-reading .tafsir-btn,
    #ayahContainer.continuous-reading .tafsir-body { display: none; }

    /* Juz section header */
    .juz-surah-header {
      display: block;
      width: 100%;
      text-align: center;
      padding: 1rem;
      margin: 2rem 0 1rem;
      background: var(--green-light);
      border-radius: var(--radius-md);
      color: var(--green);
      font-weight: 700;
      font-size: 1rem;
    }
    #ayahContainer.continuous-reading .juz-surah-header {
      display: block;
      width: 100%;
    }

    /* =============================================
       12. BOTTOM BAR — MERGED NAV + AUDIO
    ============================================= */
    #bottomBar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: var(--bar-h);
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1rem;
      z-index: 800;
      gap: .5rem;
      transition: background .3s, border-color .3s;
    }

    .bar-nav-group, .bar-audio-group {
      display: flex;
      align-items: center;
      gap: .4rem;
    }

    .bar-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .35rem;
      height: 38px;
      padding: 0 .9rem;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-pill);
      background: var(--bg);
      color: var(--text-muted);
      font-size: .78rem;
      font-weight: 600;
      white-space: nowrap;
      transition: var(--transition);
    }
    .bar-btn:hover { border-color: var(--green); color: var(--green); background: var(--green-light); }
    .bar-btn:disabled { opacity: .4; cursor: not-allowed; }

    .bar-btn-primary {
      background: var(--green);
      border-color: var(--green);
      color: #fff;
    }
    .bar-btn-primary:hover { background: var(--green-dark); border-color: var(--green-dark); color: #fff; }

    /* Play / pause circle */
    #playPauseBtn {
      width: 44px;
      height: 44px;
      padding: 0;
      border-radius: 50%;
      border: none;
      background: var(--green);
      color: #fff;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(19,111,60,.35);
      transition: var(--transition);
      flex-shrink: 0;
    }
    #playPauseBtn:hover { background: var(--green-dark); transform: scale(1.07); }
    #playPauseBtn.playing { background: var(--green-dark); }

    #speedSelect {
      height: 36px;
      padding: 0 .5rem;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--bg);
      color: var(--text);
      font-size: .78rem;
      font-weight: 600;
      outline: none;
      cursor: pointer;
      transition: border-color .2s;
    }
    #speedSelect:focus { border-color: var(--green); }

    /* =============================================
       13. SETTINGS DRAWER
    ============================================= */
    .drawer-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.45);
      z-index: 1100;
      opacity: 0;
      visibility: hidden;
      transition: opacity .3s, visibility .3s;
    }
    .drawer-backdrop.open { opacity: 1; visibility: visible; }

    #settingsDrawer {
      position: fixed;
      top: 0;
      right: -380px;
      width: min(360px, 90vw);
      height: 100%;
      background: var(--surface);
      z-index: 1200;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 1.5rem 1.25rem;
      transition: right .3s cubic-bezier(.4,0,.2,1), background .3s;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }
    #settingsDrawer.open { right: 0; }

    .drawer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }
    .drawer-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--green);
    }
    .drawer-close {
      width: 32px;
      height: 32px;
      border: none;
      border-radius: 50%;
      background: var(--bg);
      color: var(--text-muted);
      font-size: .9rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
    }
    .drawer-close:hover { background: var(--border); color: var(--text); transform: rotate(90deg); }

    .setting-group { display: flex; flex-direction: column; gap: .5rem; }
    .setting-label {
      font-size: .82rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: .06em;
    }

    .setting-select {
      width: 100%;
      padding: .6rem .75rem;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--bg);
      color: var(--text);
      font-size: .9rem;
      font-family: inherit;
      outline: none;
      transition: border-color .2s, background .3s;
    }
    .setting-select:focus { border-color: var(--green); }

    .size-row {
      display: flex;
      align-items: center;
      gap: .75rem;
    }
    .size-row input[type="range"] {
      flex: 1;
      accent-color: var(--green);
      height: 4px;
    }
    .size-val {
      font-size: .85rem;
      font-weight: 700;
      color: var(--green);
      min-width: 36px;
      text-align: right;
    }

    .checkbox-list {
      display: flex;
      flex-direction: column;
      gap: .55rem;
      max-height: 220px;
      overflow-y: auto;
      padding-right: .25rem;
    }
    .checkbox-row {
      display: flex;
      align-items: center;
      gap: .6rem;
      font-size: .88rem;
      color: var(--text);
    }
    .checkbox-row input[type="checkbox"] {
      width: 17px;
      height: 17px;
      accent-color: var(--green);
      flex-shrink: 0;
    }

    /* Dark mode toggle row */
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: .6rem .75rem;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--bg);
      transition: background .3s, border-color .3s;
    }
    .toggle-label {
      display: flex;
      align-items: center;
      gap: .6rem;
      font-size: .9rem;
      font-weight: 600;
      color: var(--text);
    }
    .toggle-switch {
      position: relative;
      width: 42px;
      height: 24px;
      flex-shrink: 0;
    }
    .toggle-switch input { opacity: 0; width: 0; height: 0; }
    .toggle-track {
      position: absolute;
      inset: 0;
      border-radius: 24px;
      background: var(--border);
      cursor: pointer;
      transition: background .2s;
    }
    .toggle-track::after {
      content: '';
      position: absolute;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #fff;
      top: 3px;
      left: 3px;
      transition: transform .2s;
    }
    .toggle-switch input:checked + .toggle-track { background: var(--green); }
    .toggle-switch input:checked + .toggle-track::after { transform: translateX(18px); }

    /* =============================================
       14. BOOKMARKS MODAL
    ============================================= */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.55);
      z-index: 1300;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      opacity: 0;
      visibility: hidden;
      transition: opacity .25s, visibility .25s;
    }
    .modal-backdrop.open { opacity: 1; visibility: visible; }

    .modal-box {
      background: var(--surface);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 580px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: var(--shadow-lg);
      transition: background .3s;
    }
    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.25rem 1.5rem 1rem;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .modal-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--green);
    }
    .modal-close {
      width: 32px;
      height: 32px;
      border: none;
      border-radius: 50%;
      background: var(--bg);
      color: var(--text-muted);
      font-size: .9rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
    }
    .modal-close:hover { background: var(--border); color: var(--text); transform: rotate(90deg); }

    .modal-body {
      flex: 1;
      overflow-y: auto;
      padding: 1rem 1.25rem 1.25rem;
    }

      flex-direction: column;
      gap: .6rem;
    }

    .bk-heading {
      font-size: .78rem;
      font-weight: 700;
      color: var(--green);
      text-transform: uppercase;
      letter-spacing: .05em;
    }
    .bk-arabic {
      direction: rtl;
      text-align: right;
      font-size: 1.5rem;
      line-height: 2.1;
      color: var(--text);
    }
    .bk-translation {
      font-family: 'Merriweather', serif;
      font-size: .88rem;
      line-height: 1.75;
      color: var(--text);
    }
    .bk-source {
      font-size: .75rem;
      color: var(--text-faint);
      font-style: italic;
    }
    .bk-actions {
      display: flex;
      gap: .5rem;
      justify-content: flex-end;
      border-top: 1px solid var(--border);
      padding-top: .7rem;
      margin-top: .2rem;
    }
    .bk-btn {
      padding: .38rem .9rem;
      border-radius: var(--radius-sm);
      font-size: .8rem;
      font-weight: 600;
      border: 1px solid;
      cursor: pointer;
      transition: var(--transition);
    }
    .bk-btn-open {
      background: var(--green);
      border-color: var(--green);
      color: #fff;
    }
    .bk-btn-open:hover { background: var(--green-dark); border-color: var(--green-dark); }
    .bk-btn-del {
      background: var(--surface);
      border-color: var(--border);
      color: #c0392b;
    }
    .bk-btn-del:hover { background: #fff0f0; border-color: #c0392b; }

    .empty-state {
      text-align: center;
      padding: 2.5rem 1rem;
      color: var(--text-muted);
    }
    .empty-state-icon { font-size: 2.5rem; margin-bottom: .75rem; }
    .empty-state p { font-size: .9rem; }

    /* =============================================
       15. COLLECTIONS MODAL
    ============================================= */
    .collection-tile {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: .85rem 1rem;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--bg);
      color: var(--text);
      font-size: .92rem;
      font-weight: 600;
      text-align: left;
      margin-bottom: .6rem;
      transition: var(--transition);
      cursor: pointer;
    }
    .collection-tile:hover { border-color: var(--green); color: var(--green); background: var(--green-light); }
    .collection-count {
      background: var(--green);
      color: #fff;
      border-radius: var(--radius-pill);
      font-size: .7rem;
      font-weight: 700;
      padding: .15rem .5rem;
      min-width: 22px;
      text-align: center;

      align-items: center;
      gap: .6rem;

      padding: .8rem 1rem;

      border-radius: var(--radius-md);
      background: transparent;
      color: var(--text-muted);
      font-size: .88rem;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
      transition: var(--transition);
      margin-bottom: .6rem;
    }
    .new-collection-btn:hover { border-color: var(--green); color: var(--green); }

    .new-collection-form {
      display: none;
      flex-direction: column;
      gap: .6rem;
      padding: .85rem;
      background: var(--green-light);
      border-radius: var(--radius-md);
      margin-bottom: .6rem;
    }
    .new-collection-form.open { display: flex; }
    .new-collection-form input {
      padding: .6rem .75rem;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface);
      color: var(--text);
      font-family: inherit;
      font-size: .9rem;
      outline: none;
      transition: border-color .2s;
    }
    .new-collection-form input:focus { border-color: var(--green); }
    .new-collection-form-actions {
      display: flex;
      gap: .5rem;
      justify-content: flex-end;
    }

      padding: .45rem 1rem;
      border: none;
      border-radius: var(--radius-sm);
      background: var(--green);
      color: #fff;
      font-size: .85rem;
      font-weight: 700;
      cursor: pointer;
      transition: var(--transition);
    }
    .coll-create-btn:hover { background: var(--green-dark); }
    .coll-cancel-btn {
      padding: .45rem 1rem;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      background: transparent;
      color: var(--text-muted);
      font-size: .85rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
    }
    .coll-cancel-btn:hover { border-color: var(--text-muted); color: var(--text); }

    /* =============================================
       16. TOAST NOTIFICATIONS
    ============================================= */
    #toastContainer {
      position: fixed;
      bottom: calc(var(--bar-h) + 14px);
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column-reverse;
      gap: .5rem;
      z-index: 9000;
      pointer-events: none;
    }
    .toast {
      background: #1a202c;
      color: #fff;
      padding: .65rem 1.2rem;
      border-radius: var(--radius-pill);
      font-size: .85rem;
      font-weight: 600;
      white-space: nowrap;
      box-shadow: var(--shadow-md);
      opacity: 0;
      transform: translateY(8px);
      transition: opacity .25s, transform .25s;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast.success { background: var(--green); }
    .toast.error   { background: #c0392b; }

    /* =============================================
       17. LOADING OVERLAY
    ============================================= */
    #loadingOverlay {
      position: fixed;
      inset: 0;
      background: rgba(255,255,255,.92);
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 1rem;
      z-index: 9999;
    }
    [data-theme="dark"] #loadingOverlay { background: rgba(15,17,23,.92); }
    #loadingOverlay.show { display: flex; }
    .spinner {
      width: 46px;
      height: 46px;
      border: 4px solid var(--border);
      border-top-color: var(--green);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { font-size: .95rem; font-weight: 600; color: var(--green); }

    /* =============================================
       18. SCROLL-TO-TOP BUTTON
    ============================================= */
    #scrollTopBtn {
      position: fixed;
      bottom: calc(var(--bar-h) + 14px);
      right: 1.25rem;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--text-muted);
      font-size: .9rem;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-sm);
      z-index: 700;
      opacity: 0;
      pointer-events: none;
      transition: opacity .3s, transform .3s, background .2s;
      transform: translateY(6px);
    }
    #scrollTopBtn.visible {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }
    #scrollTopBtn:hover { background: var(--green); color: #fff; border-color: var(--green); }

    /* =============================================
       19. RESPONSIVE — 768px
    ============================================= */
    @media (max-width: 768px) {

      .nav-links  { display: none; }

      .setting-select { padding: .5rem .65rem; font-size: .85rem; }
      .checkbox-row { font-size: .82rem; }

      .modal-box { max-height: 90vh; border-radius: var(--radius-md); }
      .modal-head { padding: .9rem 1rem .8rem; }
      .modal-body { padding: .75rem .9rem .9rem; }
      .modal-title { font-size: .95rem; }

      .bookmark-card { padding: .8rem .9rem; gap: .45rem; }
      .bk-heading { font-size: .72rem; }
      .bk-arabic { font-size: 1.2rem; }
      .bk-translation { font-size: .82rem; line-height: 1.6; }

      #toastContainer { bottom: calc(var(--bar-h) + 8px); }
    }

    /* =============================================
       20. RESPONSIVE — 480px (small phones)
    ============================================= */
    @media (max-width: 480px) {
      .header-action-group .hdr-btn span { display: none; }
      .hdr-btn { padding: .38rem .65rem; }

      .bar-btn { padding: 0 .55rem; min-width: 36px; }

      #ayahContainer.continuous-reading { padding: .7rem .75rem; line-height: 2.4; }
    }
  </style>
</head>

  <script>
    'use strict';

    /* =============================================
       CONFIGURATION
    ============================================= */
    const SOURCES = {
      "Muhammad Sarwar (eng)":    "https://raw.githubusercontent.com/fawazahmed0/quran-api/refs/heads/1/database/chapterverse/eng-muhammadsarwar.txt",
      "Ali Quli Qarai (eng)":     "https://raw.githubusercontent.com/fawazahmed0/quran-api/refs/heads/1/database/chapterverse/eng-aliquliqarai1.txt",

      "Mustafa Khattab (eng)":    "https://raw.githubusercontent.com/fawazahmed0/quran-api/refs/heads/1/database/chapterverse/eng-mustafakhattaba.txt",
    };

    const RECITER_PATTERNS = {
      "Abdul Basit":           "https://download.quranicaudio.com/quran/abdul_basit_murattal/{ch3}.mp3",
      "Maher Al-Muaiqly":      "https://download.quranicaudio.com/quran/maher_256/{ch3}.mp3",
      "Saad Al-Ghamdi":        "https://download.quranicaudio.com/quran/sa3d_al-ghaamidi/complete/{ch3}.mp3",
      "Yasser Al-Dosari":      "https://download.quranicaudio.com/quran/yasser_ad-dussary/{ch3}.mp3",
      "Abdurrahman as-Sudais": "https://download.quranicaudio.com/quran/abdurrahmaan_as-sudays/{ch3}.mp3",
    };

    async function loadRecitersFromJson() {
      try {
        const res = await fetch('https://raw.githubusercontent.com/rzkytmgr/quran-api/refs/heads/master/src/db/EntireReciters.db.json');
        if (!res.ok) return;
        const arr = await res.json();
        for (const r of arr) {
          if (r && r.folder && r.folder.surah && r.name) {
            RECITERS[r.name] = `https://download.quranicaudio.com${r.folder.surah}{ch3}.mp3`;
          }
        }
        populateReciterSelect();
      } catch { /* non-critical */ }
    }

    function buildAudioUrl(surah) {
      const pattern = RECITERS[selectedReciter] || RECITERS[Object.keys(RECITERS)[0]];

        cb.type = 'checkbox';

            visibleTranslations = visibleTranslations.filter(s => s !== source);

          localStorage.setItem('visibleTranslations', JSON.stringify(visibleTranslations));
          currentViewType === 'juz' ? await renderJuz(currentJuz) : await renderSurah(currentSurah);

        label.appendChild(document.createTextNode(' ' + source));
        translationCheckboxes.appendChild(label);
      });
    }

    /* =============================================
       DATA FETCHING
    ============================================= */
    function parseSourceText(txt) {
      const map = {};
      if (!txt) return map;
      for (let raw of txt.split(/\r?\n/)) {
        raw = raw.trim();
        if (!raw) continue;
        const parts = raw.split('|');
        if (parts.length < 3) continue;
        const ch = parseInt(parts[0], 10);
        const v  = parseInt(parts[1], 10);
        if (!isFinite(ch) || !isFinite(v)) continue;
        map[`${ch}:${v}`] = parts.slice(2).join('|').trim();
      }
      return map;
    }

    async function fetchAllSources() {
      const names = Object.keys(SOURCES);
      await Promise.all(names.map(async name => {
        if (MAPS[name]) return;
        const url = SOURCES[name];
        if (!url) { MAPS[name] = {}; return; }
        if (CACHE[url]) { MAPS[name] = CACHE[url]; return; }
        try {
          const res = await fetch(url);
          if (!res.ok) { MAPS[name] = {}; return; }
          const txt = await res.text();
          const parsed = parseSourceText(txt);
          MAPS[name] = parsed;
          CACHE[url] = parsed;
        } catch { MAPS[name] = {}; }
      }));
    }

    async function fetchSurahData(surahNumber) {
      const script = getSelectedScript();
      const cacheKey = `${surahNumber}:${script}`;
      if (SURAH_CACHE.has(cacheKey)) return SURAH_CACHE.get(cacheKey);
      const apiScript = ['uthmani','indopak'].includes(script) ? script : 'indopak';
      try {
        const res = await fetch(`https://ummahapi.com/api/quran/surah/${surahNumber}?script=${apiScript}`);
        const json = await res.json();
        const verses = json.data
          ? (json.data.ayahs || json.data.verses || json.data)
          : (json.ayahs || json.verses || json);
        SURAH_CACHE.set(cacheKey, verses);
        return verses;
      } catch { return []; }
    }

    async function fetchJuzData(juzNumber) {
      if (JUZ_CACHE.has(juzNumber)) return JUZ_CACHE.get(juzNumber);
      try {
        const res = await fetch(`${JUZ_API_BASE}/${juzNumber}/quran-uthmani`);
        if (!res.ok) return null;
        const json = await res.json();
        JUZ_CACHE.set(juzNumber, json.data);
        return json.data;
      } catch { return null; }
    }

    function parseJuzData(juzData) {
      if (!juzData || !juzData.ayahs) return [];
      return juzData.ayahs.map(a => ({
        surah:      a.surah.number,
        verse:      a.numberInSurah,
        arabicText: a.text || '',
        surahName:  a.surah.englishName,
        surahNameAr:a.surah.name,
      }));
    }

    async function loadTafsirData() {
      try {
        const res = await fetch('tafsir.json');
        if (!res.ok) return;
        const data = await res.json();
        data.forEach(s => {
          TAFSIR_DATA[s.surah] = {};
          s.verses.forEach(v => { TAFSIR_DATA[s.surah][v.reference] = v.tafsir; });
        });
      } catch { /* tafsir.json not required */ }
    }

    function getTafsir(surah, verse) {
      if (!TAFSIR_DATA[surah]) return null;
      if (TAFSIR_DATA[surah][String(verse)]) return TAFSIR_DATA[surah][String(verse)];
      for (const ref in TAFSIR_DATA[surah]) {
        if (ref.includes('-')) {
          const [s, e] = ref.split('-').map(Number);
          if (verse >= s && verse <= e) return TAFSIR_DATA[surah][ref];
        }
      }
      return null;
    }

    /* =============================================
       RENDER: SURAH
    ============================================= */
    async function renderSurah(surah) {
      currentSurah = surah;
      currentViewType = 'surah';
      const token = ++renderToken;

      const nameEn = SURAH_NAMES[surah - 1]    || `Surah ${surah}`;
      const nameAr = SURAH_NAMES_AR[surah - 1] || '';

      surahTitleAr.textContent = nameAr;
      surahTitleEn.textContent = nameEn;
      surahMeta.textContent = '';

      if (!SURAH_CACHE.has(`${surah}:${getSelectedScript()}`)) showLoading();

      const ayahsList  = await fetchSurahData(surah);
      const validAyahs = Array.isArray(ayahsList)
        ? ayahsList
        : (ayahsList?.ayahs || []);
      if (token !== renderToken) return;

      const displayCount = surah === 1 ? Math.max(0, validAyahs.length - 1) : validAyahs.length;
      const revealType   = surah === 9 ? 'Medinan' : 'Meccan';
      surahMeta.textContent = `Surah ${surah} · ${revealType} · ${displayCount} Ayahs`;
      document.title = `${nameEn} — Noor Al Huda`;

      // Bismillah
      bismillahWrap.innerHTML = '';
      if (surah !== 9) {
        const img = document.createElement('img');
        img.src = 'bismillah.png';
        img.alt = 'Bismillah al-Rahman al-Rahim';
        img.onerror = () => img.style.display = 'none';
        bismillahWrap.appendChild(img);
      }

      // Audio
      const audioUrl = buildAudioUrl(surah);
      if (audioUrl) {
        const wasPlaying = !surahAudio.paused;
        const oldTime    = surahAudio.currentTime || 0;
        surahAudio.src   = audioUrl;
        surahAudio.load();
        if (wasPlaying) surahAudio.play().catch(() => {});
        else surahAudio.addEventListener('loadedmetadata', () => {
          try { surahAudio.currentTime = oldTime; } catch { }
        }, { once: true });
      }

      // Render
      ayahContainer.innerHTML = '';
      ayahContainer.classList.toggle('continuous-reading', currentMode === 'reading');

      if (validAyahs.length > 0) {
        currentMode === 'reading'
          ? renderReadingMode(surah, validAyahs)
          : renderTranslationMode(surah, validAyahs);
      } else {
        ayahContainer.innerHTML = '<p style="text-align:center;padding:2rem;color:var(--text-muted)">Could not load verses. Please refresh.</p>';
      }

      hideLoading();
      saveLastRead('surah', surah);
      renderResumeChip('surah', surah);
      openPendingBookmarkAfterRender();
    }

    /* =============================================
       RENDER: TRANSLATION MODE
    ============================================= */
    function renderTranslationMode(surah, ayahsData) {
      ayahsData.forEach(item => {
        const v = item.numberInSurah || item.number || item.ayah;
        const textContent = item.text || item.arabic || '';
        if (!v || (surah === 1 && v === 1)) return;

        const displayVerse = surah === 1 ? v - 1 : v;

        const card = document.createElement('div');
        card.className = 'quran-verse';
        card.id = `ayah-${v}`;

        /* — Actions menu — */
        const actionsDiv = document.createElement('div');
        actionsDiv.className = 'ayah-actions';

        const dotsBtn = document.createElement('button');
        dotsBtn.className = 'dots-btn';
        dotsBtn.innerHTML = '⋯';
        dotsBtn.setAttribute('aria-label', 'Ayah options');

        const menu = document.createElement('div');
        menu.className = 'ayah-menu';

        function mkItem(label, cls) {
          const btn = document.createElement('button');
          btn.className = 'menu-item';
          btn.innerHTML = `<span class="menu-icon ${cls}"></span>${label}`;
          menu.appendChild(btn);
          return btn;
        }

        const bkBtn   = mkItem('Bookmark',           'icon-bookmark');
        const colBtn  = mkItem('Save to Collection', 'icon-collection');
        const cpBtn   = mkItem('Copy',               'icon-copy');
        const shBtn   = mkItem('Share',              'icon-share');

        actionsDiv.appendChild(dotsBtn);
        actionsDiv.appendChild(menu);

        /* — Number badge — */
        const numBadge = document.createElement('div');
        numBadge.className = 'ayah-number';
        numBadge.textContent = `Ayah ${displayVerse}`;

        /* — Arabic text — */
        const arabic = document.createElement('div');
        arabic.className = 'ayah-arabic';
        arabic.dir = 'rtl';
        applyScriptStyles(arabic, arabicFont);
        arabic.style.fontSize = arabicSize + 'px';
        arabic.textContent = textContent;

        card.appendChild(actionsDiv);
        card.appendChild(numBadge);
        card.appendChild(arabic);

        /* — Translations — */
        visibleTranslations.forEach(source => {
          const tText = cleanText(getText(source, surah, v));
          if (!tText) return;
          const td = document.createElement('div');
          td.className = 'ayah-translation';
          td.textContent = tText;
          const src = document.createElement('div');
          src.className = 'translation-source';
          src.textContent = `— ${source}`;
          card.appendChild(td);
          card.appendChild(src);
        });

        /* — Tafsir — */
        const tText = cleanText(getTafsir(surah, v));
        if (tText) {
          const tBtn = document.createElement('button');
          tBtn.className = 'tafsir-btn';
          tBtn.innerHTML = '<span>Tafsir</span><span class="tafsir-arrow">▼</span>';

          const tBody = document.createElement('div');
          tBody.className = 'tafsir-body';

          const tInner = document.createElement('div');
          tInner.className = 'tafsir-inner';

          const tLabel = document.createElement('div');
          tLabel.className = 'tafsir-label';
          tLabel.textContent = 'Commentary';

          const tContent = document.createElement('div');
          tContent.className = 'tafsir-text';
          tContent.textContent = tText;

          tInner.appendChild(tLabel);
          tInner.appendChild(tContent);
          tBody.appendChild(tInner);
          card.appendChild(tBtn);
          card.appendChild(tBody);

          tBtn.addEventListener('click', () => {
            tBtn.classList.toggle('open');
            tBody.classList.toggle('open');
          });
        }

        ayahContainer.appendChild(card);
        cardObserver.observe(card);

        /* — Menu toggle — */
        dotsBtn.addEventListener('click', e => {
          e.stopPropagation();
          document.querySelectorAll('.ayah-menu.open').forEach(m => {
            if (m !== menu) m.classList.remove('open');
          });
          menu.classList.toggle('open');
        });

        /* — Bookmark — */
        bkBtn.addEventListener('click', () => {
          addBookmark(surah, v, textContent);
          menu.classList.remove('open');
        });

        /* — Save to Collection — */
        colBtn.addEventListener('click', () => {
          const source = visibleTranslations[0] || '';
          const trans  = source ? cleanText(getText(source, surah, v)) : '';
          openCollectionsModal({ surah, verse: v, arabic: textContent, translation: trans, source });
          menu.classList.remove('open');
        });

        /* — Copy — */
        cpBtn.addEventListener('click', async () => {
          const tLines = visibleTranslations
            .map(s => { const t = cleanText(getText(s, surah, v)); return t ? `${t}\n— ${s}` : ''; })
            .filter(Boolean).join('\n\n');
          const str = `${SURAH_NAMES[surah-1]} ${surah}:${displayVerse}\n\n${textContent}\n\n${tLines}`;
          try {
            await navigator.clipboard.writeText(str);
            showToast('Copied to clipboard!', 'success');
          } catch { showToast('Copy failed — please try manually.', 'error'); }
          menu.classList.remove('open');
        });

        /* — Share — */
        shBtn.addEventListener('click', async () => {
          const url = `${location.origin}${location.pathname}#${surah}`;
          const tLines = visibleTranslations
            .map(s => { const t = cleanText(getText(s, surah, v)); return t ? `${t}\n— ${s}` : ''; })
            .filter(Boolean).join('\n\n');
          const str = `${SURAH_NAMES[surah-1]} ${surah}:${displayVerse}\n\n${textContent}\n\n${tLines}\n\n${url}`;
          if (navigator.share) {
            try { await navigator.share({ title: `${SURAH_NAMES[surah-1]} ${surah}:${displayVerse}`, text: str }); }
            catch { /* user cancelled */ }
          } else {
            try {
              await navigator.clipboard.writeText(str);
              showToast('Link copied to clipboard!', 'success');
            } catch { showToast('Share failed.', 'error'); }
          }
          menu.classList.remove('open');
        });
      });
    }

    /* =============================================
       RENDER: READING MODE (continuous inline)
    ============================================= */
    function renderReadingMode(surah, ayahsData) {
      ayahsData.forEach(item => {
        const v = item.numberInSurah || item.number || item.ayah;
        const textContent = item.text || item.arabic || '';
        if (!v || (surah === 1 && v === 1)) return;

        const card = document.createElement('div');
        card.className = 'quran-verse';
        card.id = `ayah-${v}`;

        const arabic = document.createElement('span');
        arabic.className = 'ayah-arabic';
        applyScriptStyles(arabic, arabicFont);
        arabic.style.setProperty('font-size', arabicSize + 'px', 'important');
        arabic.textContent = textContent + ' ';

        const numEl = document.createElement('span');
        numEl.className = 'ayah-number';
        numEl.textContent = surah === 1 ? v - 1 : v;

        card.appendChild(arabic);
        card.appendChild(numEl);
        card.appendChild(document.createTextNode(' '));
        ayahContainer.appendChild(card);
      });
    }

    /* =============================================
       RENDER: JUZ
    ============================================= */
    async function renderJuz(juzNumber) {
      currentJuz      = juzNumber;
      currentViewType = 'juz';
      const token     = ++renderToken;

      surahTitleAr.textContent = `الجزء ${juzNumber}`;
      surahTitleEn.textContent = `Juz ${juzNumber}`;
      surahMeta.textContent    = `Part ${juzNumber} of 30`;
      document.title           = `Juz ${juzNumber} — Noor Al Huda`;

      bismillahWrap.innerHTML = '';
      if (!JUZ_CACHE.has(juzNumber)) showLoading();

      const juzData = await fetchJuzData(juzNumber);
      if (token !== renderToken) return;

      if (!juzData) {
        ayahContainer.innerHTML = '<p style="text-align:center;padding:2rem;color:var(--text-muted)">Failed to load Juz data.</p>';
        hideLoading(); return;
      }

      const ayahs = parseJuzData(juzData);
      if (!Object.keys(MAPS).length) await fetchAllSources();

      ayahContainer.innerHTML = '';
      ayahContainer.classList.toggle('continuous-reading', currentMode === 'reading');

      currentMode === 'reading'
        ? renderJuzReadingMode(ayahs)
        : renderJuzTranslationMode(ayahs);

      hideLoading();
      saveLastRead('juz', juzNumber);
      renderResumeChip('juz', juzNumber);
    }

    function renderJuzReadingMode(ayahs) {
      let lastSurah = null;
      let container = null;

      ayahs.forEach(ayah => {
        if (ayah.surah !== lastSurah) {
          const hdr = document.createElement('div');
          hdr.className = 'juz-surah-header';
          hdr.textContent = `${ayah.surahNameAr} — ${ayah.surahName}`;
          ayahContainer.appendChild(hdr);

          if (ayah.surah !== 9) {
            const wrap = document.createElement('div');
            wrap.style.cssText = 'text-align:center;margin:1rem 0;';
            const img = document.createElement('img');
            img.src = 'bismillah.png'; img.alt = 'Bismillah';
            img.style.cssText = 'max-width:280px;width:70%;margin:0 auto;';
            img.onerror = () => wrap.style.display = 'none';
            wrap.appendChild(img);
            ayahContainer.appendChild(wrap);
          }

          container = document.createElement('div');
          container.className = 'quran-verse'; // will be inline-collapsed by continuous-reading
          container.style.cssText = 'display:block;width:100%;direction:rtl;text-align:right;line-height:2.9;padding:1rem;';
          ayahContainer.appendChild(container);
          lastSurah = ayah.surah;
        }

        if (ayah.surah === 1 && ayah.verse === 1) return;

        const arabic = document.createElement('span');
        arabic.className = 'ayah-arabic';
        applyScriptStyles(arabic, arabicFont);
        arabic.style.cssText = `display:inline;font-size:${arabicSize}px;`;
        arabic.textContent = ayah.arabicText + ' ';

        const numEl = document.createElement('span');
        numEl.className = 'ayah-number';
        numEl.style.cssText = 'display:inline-flex;width:1.9em;height:1.9em;border-radius:50%;border:1.5px solid var(--green);color:var(--green);font-size:.65em;align-items:center;justify-content:center;vertical-align:middle;margin:0 .25em;padding:0;';
        numEl.textContent = ayah.surah === 1 ? ayah.verse - 1 : ayah.verse;

        container.appendChild(arabic);
        container.appendChild(numEl);
        container.appendChild(document.createTextNode(' '));
      });
    }

    function renderJuzTranslationMode(ayahs) {
      let lastSurah = null;
      ayahs.forEach((ayah, idx) => {
        if (ayah.surah !== lastSurah) {
          const hdr = document.createElement('div');
          hdr.className = 'juz-surah-header';
          hdr.textContent = `${ayah.surahNameAr} — ${ayah.surahName}`;
          ayahContainer.appendChild(hdr);

          if (ayah.surah !== 9) {
            const wrap = document.createElement('div');
            wrap.style.cssText = 'text-align:center;margin:1rem 0 1.5rem;';
            const img = document.createElement('img');
            img.src = 'bismillah.png'; img.alt = 'Bismillah';
            img.style.cssText = 'max-width:280px;width:70%;margin:0 auto;';
            img.onerror = () => wrap.style.display = 'none';
            wrap.appendChild(img);
            ayahContainer.appendChild(wrap);
          }
          lastSurah = ayah.surah;
        }

        if (ayah.surah === 1 && ayah.verse === 1) return;

        const displayVerse = ayah.surah === 1 ? ayah.verse - 1 : ayah.verse;
        const card = document.createElement('div');
        card.className = 'quran-verse';
        card.id = `ayah-${idx}`;

        const actionsDiv = document.createElement('div');
        actionsDiv.className = 'ayah-actions';

        const dotsBtn = document.createElement('button');
        dotsBtn.className = 'dots-btn';
        dotsBtn.innerHTML = '⋯';
        const menu = document.createElement('div');
        menu.className = 'ayah-menu';

        const bkBtn  = document.createElement('button'); bkBtn.className  = 'menu-item'; bkBtn.innerHTML  = '<span class="menu-icon icon-bookmark"></span>Bookmark';  menu.appendChild(bkBtn);
        const cpBtn  = document.createElement('button'); cpBtn.className  = 'menu-item'; cpBtn.innerHTML  = '<span class="menu-icon icon-copy"></span>Copy';          menu.appendChild(cpBtn);
        const shBtn  = document.createElement('button'); shBtn.className  = 'menu-item'; shBtn.innerHTML  = '<span class="menu-icon icon-share"></span>Share';         menu.appendChild(shBtn);

        actionsDiv.appendChild(dotsBtn); actionsDiv.appendChild(menu);

        const numBadge = document.createElement('div');
        numBadge.className = 'ayah-number';
        numBadge.textContent = `${ayah.surahName} ${displayVerse}`;

        const arabic = document.createElement('div');
        arabic.className = 'ayah-arabic'; arabic.dir = 'rtl';
        applyScriptStyles(arabic, arabicFont);
        arabic.style.fontSize = arabicSize + 'px';
        arabic.textContent = ayah.arabicText;

        card.appendChild(actionsDiv);
        card.appendChild(numBadge);
        card.appendChild(arabic);

        visibleTranslations.forEach(source => {
          const t = cleanText(getText(source, ayah.surah, ayah.verse));
          if (!t) return;
          const td = document.createElement('div'); td.className = 'ayah-translation'; td.textContent = t;
          const sl = document.createElement('div'); sl.className = 'translation-source'; sl.textContent = `— ${source}`;
          card.appendChild(td); card.appendChild(sl);
        });

        const tText = cleanText(getTafsir(ayah.surah, ayah.verse));
        if (tText) {
          const tBtn = document.createElement('button');
          tBtn.className = 'tafsir-btn';
          tBtn.innerHTML = '<span>Tafsir</span><span class="tafsir-arrow">▼</span>';
          const tBody = document.createElement('div');
          tBody.className = 'tafsir-body';
          const tInner = document.createElement('div'); tInner.className = 'tafsir-inner';
          const tLbl = document.createElement('div'); tLbl.className = 'tafsir-label'; tLbl.textContent = 'Commentary';
          const tCnt = document.createElement('div'); tCnt.className = 'tafsir-text'; tCnt.textContent = tText;
          tInner.appendChild(tLbl); tInner.appendChild(tCnt); tBody.appendChild(tInner);
          card.appendChild(tBtn); card.appendChild(tBody);
          tBtn.addEventListener('click', () => { tBtn.classList.toggle('open'); tBody.classList.toggle('open'); });
        }

        ayahContainer.appendChild(card);
        cardObserver.observe(card);

        dotsBtn.addEventListener('click', e => {
          e.stopPropagation();
          document.querySelectorAll('.ayah-menu.open').forEach(m => { if (m !== menu) m.classList.remove('open'); });
          menu.classList.toggle('open');
        });
        bkBtn.addEventListener('click', () => { addBookmark(ayah.surah, ayah.verse, ayah.arabicText); menu.classList.remove('open'); });
        cpBtn.addEventListener('click', async () => {
          const tLines = visibleTranslations.map(s => { const t = cleanText(getText(s, ayah.surah, ayah.verse)); return t ? `${t}\n— ${s}` : ''; }).filter(Boolean).join('\n\n');
          const str = `${ayah.surahName} ${ayah.surah}:${displayVerse}\n\n${ayah.arabicText}\n\n${tLines}`;
          try { await navigator.clipboard.writeText(str); showToast('Copied!', 'success'); }
          catch { showToast('Copy failed.', 'error'); }
          menu.classList.remove('open');
        });
        shBtn.addEventListener('click', async () => {
          const url = `${location.origin}${location.pathname}#${ayah.surah}`;
          if (navigator.share) {
            try { await navigator.share({ title: `${ayah.surahName} ${ayah.surah}:${displayVerse}`, text: ayah.arabicText + '\n\n' + url }); } catch {}
          } else {
            try { await navigator.clipboard.writeText(url); showToast('Link copied!', 'success'); }
            catch { showToast('Share failed.', 'error'); }
          }
          menu.classList.remove('open');
        });
      });
    }

    /* =============================================
       MODE TOGGLE
    ============================================= */
    translationModeBtn.addEventListener('click', async () => {
      if (currentMode === 'translation') return;
      currentMode = 'translation';
      translationModeBtn.classList.add('active');
      translationModeBtn.setAttribute('aria-selected', 'true');
      readingModeBtn.classList.remove('active');
      readingModeBtn.setAttribute('aria-selected', 'false');
      currentViewType === 'juz' ? await renderJuz(currentJuz) : await renderSurah(currentSurah);
    });

    readingModeBtn.addEventListener('click', async () => {
      if (currentMode === 'reading') return;
      currentMode = 'reading';
      readingModeBtn.classList.add('active');
      readingModeBtn.setAttribute('aria-selected', 'true');
      translationModeBtn.classList.remove('active');
      translationModeBtn.setAttribute('aria-selected', 'false');
      currentViewType === 'juz' ? await renderJuz(currentJuz) : await renderSurah(currentSurah);
    });

    /* =============================================
       GLOBAL MENU CLOSE (registered once)
    ============================================= */
    document.addEventListener('click', e => {
      if (!e.target.closest('.ayah-actions')) {
        document.querySelectorAll('.ayah-menu.open').forEach(m => m.classList.remove('open'));
      }
    });

    /* =============================================
       BOTTOM BAR NAVIGATION
    ============================================= */
    $('backToIndexBtn').addEventListener('click', () => { window.location.href = 'home'; });

    $('prevBtn').addEventListener('click', () => {
      if (currentViewType === 'juz') {
        if (currentJuz > 1) window.location.href = `?${currentJuz - 1}`;
        else showToast('This is the first Juz.', 'info');
      } else {
        if (currentSurah > 1) window.location.href = `#${currentSurah - 1}`;
        else showToast('This is the first Surah.', 'info');
      }
    });

    $('nextBtn').addEventListener('click', () => {
      if (currentViewType === 'juz') {
        if (currentJuz < 30) window.location.href = `?${currentJuz + 1}`;
        else showToast('This is the last Juz.', 'info');
      } else {
        if (currentSurah < 114) window.location.href = `#${currentSurah + 1}`;
        else showToast('This is the last Surah.', 'info');
      }
    });

    /* =============================================
       HASH CHANGE — in-page surah navigation
    ============================================= */
    window.addEventListener('hashchange', async () => {
      const num = parseInt(location.hash.slice(1), 10);
      if (Number.isFinite(num) && num >= 1 && num <= 114) {
        window.scrollTo({ top: 0, behavior: 'instant' });
        if (!Object.keys(MAPS).length) await fetchAllSources();
        await renderSurah(num);
      }
    });

    /* =============================================
       BOOKMARKS
    ============================================= */
    function getBookmarks() {
      try { return JSON.parse(localStorage.getItem('bookmarks') || '[]'); } catch { return []; }
    }
    function saveBookmarks(arr) {
      localStorage.setItem('bookmarks', JSON.stringify(arr));
    }

    function addBookmark(surah, verse, arabicText) {
      const bookmarks = getBookmarks();
      const key = `${surah}:${verse}`;
      if (bookmarks.some(b => b.key === key)) {
        showToast('Already bookmarked.', 'info'); return;
      }
      const source = visibleTranslations[0] || '';
      const trans  = source ? cleanText(getText(source, surah, verse)) : '';
      bookmarks.push({
        key, surah, verse,
        nameEn: SURAH_NAMES[surah - 1]    || `Surah ${surah}`,
        nameAr: SURAH_NAMES_AR[surah - 1] || '',
        arabic: arabicText || '',
        translation: trans,
        source,
      });
      saveBookmarks(bookmarks);
      showToast('Ayah bookmarked!', 'success');
    }

    function renderBookmarks() {
      const bookmarks = getBookmarks();
      bookmarksList.innerHTML = '';

      if (!bookmarks.length) {
        bookmarksList.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon"></div>
            <p>No saved ayahs yet.<br>Tap the menu on any verse to bookmark it.</p>
          </div>`;
        return;
      }

      bookmarks.forEach(b => {
        const card = document.createElement('div');
        card.className = 'bookmark-card';

        const heading = document.createElement('div');
        heading.className = 'bk-heading';
        heading.textContent = `${b.nameEn} · Surah ${b.surah}:${b.verse}`;

        const arabicEl = document.createElement('div');
        arabicEl.className = 'bk-arabic';
        arabicEl.dir = 'rtl';
        applyScriptStyles(arabicEl, getSelectedScript());
        arabicEl.textContent = b.arabic || '';

        const translEl = document.createElement('div');
        translEl.className = 'bk-translation';
        translEl.textContent = b.translation || '';

        const srcEl = document.createElement('div');
        srcEl.className = 'bk-source';
        srcEl.textContent = b.source ? `— ${b.source}` : '';

        const actions = document.createElement('div');
        actions.className = 'bk-actions';

        const openBtn = document.createElement('button');
        openBtn.className = 'bk-btn bk-btn-open';
        openBtn.textContent = 'Open Ayah';
        openBtn.addEventListener('click', async () => {
          currentMode = 'translation';
          translationModeBtn.classList.add('active');
          readingModeBtn.classList.remove('active');
          closeAllModals();
          await renderSurah(b.surah);
          requestAnimationFrame(() => {
            const target = document.getElementById(`ayah-${b.verse}`);
            if (target) {
              target.scrollIntoView({ behavior: 'smooth', block: 'center' });
              target.classList.add('bookmark-highlight');
              setTimeout(() => target.classList.remove('bookmark-highlight'), 2500);
            }
          });
        });

        const delBtn = document.createElement('button');
        delBtn.className = 'bk-btn bk-btn-del';
        delBtn.textContent = 'Remove';
        delBtn.addEventListener('click', () => {
          saveBookmarks(getBookmarks().filter(x => x.key !== b.key));
          showToast('Bookmark removed.', 'info');
          renderBookmarks();
        });

        actions.appendChild(openBtn);
        actions.appendChild(delBtn);
        card.appendChild(heading);
        card.appendChild(arabicEl);
        if (b.translation) card.appendChild(translEl);
        if (b.source)      card.appendChild(srcEl);
        card.appendChild(actions);
        bookmarksList.appendChild(card);
      });
    }

    bookmarksBtn.addEventListener('click', e => {
      e.stopPropagation();
      renderBookmarks();
      bookmarksModal.classList.add('open');
    });
    closeBookmarks.addEventListener('click', () => bookmarksModal.classList.remove('open'));
    bookmarksModal.addEventListener('click', e => { if (e.target === bookmarksModal) bookmarksModal.classList.remove('open'); });

    /* =============================================
       COLLECTIONS MODAL
    ============================================= */
    function getCollections() {
      try { return JSON.parse(localStorage.getItem('noorCollections') || '[]'); } catch { return []; }
    }
    function saveCollections(arr) {
      localStorage.setItem('noorCollections', JSON.stringify(arr)); 
    }

    function openCollectionsModal(pending) {
      _collectionPending = pending;
      renderCollectionsList();
      $('newCollectionForm').classList.remove('open');
      $('newCollectionInput').value = '';
      collectionsModal.classList.add('open');
    }

    function renderCollectionsList() {
      const list = $('collectionsList');
      list.innerHTML = '';
      const cols = getCollections();
      if (!cols.length) {
        const p = document.createElement('p');
        p.style.cssText = 'color:var(--text-muted);font-size:.88rem;margin-bottom:.75rem;';
        p.textContent = 'No collections yet. Create one below.';
        list.appendChild(p);
        return;
      }
      cols.forEach(c => {
        const tile = document.createElement('button');
        tile.className = 'collection-tile';
        tile.innerHTML = `<span>${c.name}</span><span class="collection-count">${(c.keys || []).length}</span>`;
        tile.addEventListener('click', () => {
          saveToCollection(c.id);
        });
        list.appendChild(tile);
      });
    }

    function saveToCollection(collectionId, name) {
      const cols = getCollections();
      let col;
      if (collectionId) {
        col = cols.find(c => c.id === collectionId);
      } else {
        col = { id: `col-${Date.now()}`, name, keys: [] };
        cols.push(col);
      }
      if (!col) return;
      col.keys = col.keys || [];
      const key = `${_collectionPending.surah}:${_collectionPending.verse}`;

      // Also persist as a bookmark
      const bookmarks = getBookmarks();
      if (!bookmarks.some(b => b.key === key)) {
        bookmarks.push({
          key,
          surah: _collectionPending.surah,
          verse: _collectionPending.verse,
          nameEn: SURAH_NAMES[_collectionPending.surah - 1] || '',
          nameAr: SURAH_NAMES_AR[_collectionPending.surah - 1] || '',
          arabic: _collectionPending.arabic,
          translation: _collectionPending.translation,
          source: _collectionPending.source,
        });
        saveBookmarks(bookmarks);
      }

      if (!col.keys.includes(key)) col.keys.push(key);
      saveCollections(cols);
      collectionsModal.classList.remove('open');
      showToast(`Saved to "${col.name}"!`, 'success');
      _collectionPending = null;
    }

    closeCollections.addEventListener('click', () => collectionsModal.classList.remove('open'));
    collectionsModal.addEventListener('click', e => { if (e.target === collectionsModal) collectionsModal.classList.remove('open'); });

    $('newCollectionBtn').addEventListener('click', () => {
      $('newCollectionForm').classList.toggle('open');
      if ($('newCollectionForm').classList.contains('open')) $('newCollectionInput').focus();
    });

    $('cancelNewCollection').addEventListener('click', () => {
      $('newCollectionForm').classList.remove('open');
      $('newCollectionInput').value = '';
    });

    $('confirmNewCollection').addEventListener('click', () => {
      const name = $('newCollectionInput').value.trim();
      if (!name) { showToast('Please enter a collection name.', 'error'); return; }
      saveToCollection(null, name);
    });

    $('newCollectionInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') $('confirmNewCollection').click();
    });

    /* =============================================
       CLOSE ALL MODALS (on Escape)
    ============================================= */
    function closeAllModals() {
      bookmarksModal.classList.remove('open');
      collectionsModal.classList.remove('open');
    }

    /* =============================================
       PENDING BOOKMARK — cross-page navigation
    ============================================= */
    function openPendingBookmarkAfterRender() {
      const raw = sessionStorage.getItem('noorPendingBookmark');
      if (!raw) return;
      let pending;
      try { pending = JSON.parse(raw); } catch {
        sessionStorage.removeItem('noorPendingBookmark'); return;
      }
      if (!pending?.surah || !pending?.verse) return;

      currentMode = 'translation';
      translationModeBtn.classList.add('active');
      readingModeBtn.classList.remove('active');

      const targetId = `ayah-${pending.verse}`;
      let attempts = 0;
      const timer = setInterval(() => {
        const target = document.getElementById(targetId);
        attempts++;
        if (target) {
          clearInterval(timer);
          sessionStorage.removeItem('noorPendingBookmark');
          target.scrollIntoView({ behavior: 'smooth', block: 'center' });
          target.classList.add('bookmark-highlight');
          setTimeout(() => target.classList.remove('bookmark-highlight'), 2500);
        } else if (attempts >= 40) {
          clearInterval(timer);
          sessionStorage.removeItem('noorPendingBookmark');
        }
      }, 150);
    }

    /* =============================================
       INIT
    ============================================= */
    (async function init() {
      // Determine what to load from URL
      let viewType = 'surah';
      let id       = 1;
      const search = location.search;

      if (search && search.startsWith('?')) {
        const qs = search.slice(1);
        if (/^\d+$/.test(qs)) {
          const n = Number(qs);
          if (n >= 1 && n <= 30) { viewType = 'juz'; id = n; }
          else if (n >= 1 && n <= 114) { viewType = 'surah'; id = n; }
        } else {
          const params = new URLSearchParams(search);
          if (params.has('juz')) {
            const n = Number(params.get('juz'));
            if (n >= 1 && n <= 30) { viewType = 'juz'; id = n; }
          } else if (params.has('id')) {
            const n = Number(params.get('id'));
            if (n >= 1 && n <= 114) { viewType = 'surah'; id = n; }
          }
        }
      } else if (location.hash && location.hash.length > 1) {
        const n = parseInt(location.hash.slice(1), 10);
        if (Number.isFinite(n) && n >= 1 && n <= 114) { viewType = 'surah'; id = n; }
      }

      currentViewType = viewType;

      // Run non-blocking tasks in parallel
      loadRecitersFromJson();
      loadTafsirData();
      populateTranslationCheckboxes();

      // Fetch translations then render
      await fetchAllSources();

      if (viewType === 'juz') {
        currentJuz = id;
        await renderJuz(id);
      } else {
        currentSurah = id;
        await renderSurah(id);
      }
    })();
  </script>
</body>
</html>
