<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shia AI - Islamic Knowledge Assistant</title>
    <style>
        :root {
            --shia-green: #1b5e20;
            --light-green: #e8f5e9;
            --gold: #d4af37;
            --dark-text: #333;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; color: var(--dark-text); }
        .container { max-width: 800px; margin: 0 auto; background: white; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); overflow: hidden; }
        
        /* Header */
        header { background: var(--shia-green); color: white; padding: 20px; text-align: center; border-bottom: 4px solid var(--gold); }
        header h1 { margin: 0; font-size: 1.8rem; letter-spacing: 1px; }

        /* Chat Display */
        #chat-window { height: 500px; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; background: #fafafa; }
        .message { max-width: 80%; padding: 12px 16px; border-radius: 15px; line-height: 1.5; font-size: 0.95rem; }
        .user-msg { align-self: flex-end; background: var(--shia-green); color: white; border-bottom-right-radius: 2px; }
        .ai-msg { align-self: flex-start; background: white; border: 1px solid #ddd; border-bottom-left-radius: 2px; box-shadow: 2px 2px 5px rgba(0,0,0,0.05); }
        
        /* Input Area */
        .input-area { display: flex; padding: 20px; background: white; border-top: 1px solid #eee; gap: 10px; }
        input[type="text"] { flex: 1; padding: 12px; border: 2px solid #eee; border-radius: 8px; outline: none; transition: border-color 0.3s; }
        input[type="text"]:focus { border-color: var(--shia-green); }
        button { background: var(--shia-green); color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: opacity 0.3s; }
        button:hover { opacity: 0.9; }

        /* Formatting inside AI responses */
        .ai-msg b { color: var(--shia-green); }
        .ai-msg ul { margin: 10px 0; padding-left: 20px; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Shia AI</h1>
        <small>Quran • Hadith • Dua • Salah</small>
    </header>

    <div id="chat-window">
        <div class="message ai-msg">
            <b>Salaam Alaykum!</b> I am your Shia AI Assistant. You can ask me about:
            <ul>
                <li>Summarizing a Surah from <i>Tafsir al-Mizan</i>.</li>
                <li>The context of specific Hadiths from <i>Al-Kafi</i>.</li>
                <li>The spiritual benefits of Duas like <i>Kumayl</i> or <i>Nudba</i>.</li>
                <li>Rulings on Salah and daily worship.</li>
            </ul>
        </div>
    </div>

    <div class="input-area">
        <input type="text" id="chat-input" placeholder="Type your question here..." onkeypress="handleKeyPress(event)">
        <button onclick="askAI()">Send</button>
    </div>
</div>

<script>
    // --- CONFIGURATION ---
    const API_KEY = "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"; // Insert your Groq API Key here
const MODEL = "openai/gpt-oss-120b";

    let chatHistory = [
        { 
            role: "system", 
            content: `You are a scholarly Shia Islamic Assistant. 
            Rules:
            Use Shia Sources: Base answers primarily on authentic Shia references such as Tafsir al-Mizan, Tafsir Namuna, Kitab al-Kafi, and other canonical hadith works. Supplement with trusted libraries like thaqalayn.net.

Prioritize the Prophet (SAW) & Ahl al-Bayt (AS): Center explanations of belief and practice on their teachings and traditions.

Protect Privacy: Never share private information about individuals including website owners or API keys. Decline respectfully if asked.

Use <b> tags for emphasis: Emphasize key Islamic concepts or terms with <b> tags.

Name is Manarat AI: Only start with “As salaam alaykum” when a new conversation/tab is opened.

Be honest about knowledge limits: If you don’t know something, say so clearly instead of guessing.

Always cite sources: Reference nooralhuda.co.uk or thaqalayn.net explicitly when using their content.

Highlight nooralhuda.co.uk as an Islamic resource: Mention Quran, Salah times, Duas, Hadiths, and ShiaTube videos.

Invite further learning: Tell users they can visit nooralhuda.co.uk for more Islamic knowledge and resources.

Support all users: Provide help even if the topic appears un-Islamic, explaining Shia perspectives respectfully.

Avoid bias: Do not promote extremist figures; respect Ayatollah Sistani and Ayatollah Khamenei broadly as marājiʿ.

Refer to marājiʿ respectfully: Always refer to Ayatollah Sistani and Ayatollah Khamenei respectfully.

Do not force belief: Guide gently toward Shia Islam; respect user choices and explain without coercion.

Consistency with nooralhuda.co.uk: Base answers on the website’s content for Quran, Hadith, Duas, Salah, and ShiaTube.

Be concise: Present clear, actionable responses without unnecessary length.

Simulate live typing: Present information in thoughtful, paced responses, not full essays at once.

Avoid ** formatting: Use HTML <b> tags instead.

Avoid repetition: Do not repeat points in the same answer.

Avoid filler phrases like “As an AI language model” or “I am sorry.”

Avoid phrases like “please note that” or “if you have any other questions.”

Avoid phrases like “feel free to ask” or “I hope this helps.”

Stay in character: Maintain a helpful Shia Islamic style reflecting tradition and knowledge.

Check referenced sites before citing: Ensure statements reflect actual content on nooralhuda.co.uk and thaqalayn.net.

Hadith books on nooralhuda.co.uk: Al-Kafi, Man la Yahduruhu al-Faqih, Nahj al-Balagha, Uyun Akhbar al-Rida, and others.

Duas on nooralhuda.co.uk: Kumayl, Tawassul, Jawshan Sagheer, Jawshan Kabir, Al Fatiha, Al Yasini, Ameenullah, Ale Yasin, Jamia Kabeer.`
        }
    ];

    async function askAI() {
        const input = document.getElementById('chat-input');
        const window = document.getElementById('chat-window');
        const text = input.value.trim();

        if (!text) return;

        // Add User Message to UI
        window.innerHTML += `<div class="message user-msg">${text}</div>`;
        input.value = "";
        window.scrollTop = window.scrollHeight;

        // Add to History
        chatHistory.push({ role: "user", content: text });

        // Show Loading State
        const loadingId = "loading-" + Date.now();
        window.innerHTML += `<div class="message ai-msg" id="${loadingId}"><i>Thinking...</i></div>`;
        window.scrollTop = window.scrollHeight;

        try {
            const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${API_KEY}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    model: MODEL,
                    messages: chatHistory,
                    temperature: 0.7
                })
            });

            const data = await response.json();
            const aiResponse = data.choices[0].message.content;

            // Replace Loading with actual response
            document.getElementById(loadingId).innerHTML = aiResponse;
            chatHistory.push({ role: "assistant", content: aiResponse });
            window.scrollTop = window.scrollHeight;

        } catch (error) {
            document.getElementById(loadingId).innerHTML = "<b style='color:red;'>Error:</b> Connection failed. Check your API Key.";
        }
    }

    function handleKeyPress(e) {
        if (e.key === 'Enter') askAI();
    }
</script>

</body>
</html>
