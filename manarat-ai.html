<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manarat AI</title>
    <style>
        :root {
            --shia-green: #1b5e20;
            --gold: #d4af37;
            --dark-text: #333;
        }
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; color: var(--dark-text); }
        .container { max-width: 800px; margin: 0 auto; background: white; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); overflow: hidden; }
        header { background: var(--shia-green); color: white; padding: 20px; text-align: center; border-bottom: 4px solid var(--gold); }
        header h1 { margin: 0; font-size: 1.8rem; }
        #chat-window { height: 500px; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; background: #fafafa; }
        .message { max-width: 85%; padding: 12px 16px; border-radius: 15px; line-height: 1.6; font-size: 0.95rem; }
        .user-msg { align-self: flex-end; background: var(--shia-green); color: white; border-bottom-right-radius: 2px; }
        .ai-msg { align-self: flex-start; background: white; border: 1px solid #ddd; border-bottom-left-radius: 2px; }
        .ai-image { max-width: 100%; border-radius: 10px; margin-top: 10px; border: 2px solid var(--gold); }
        .input-area { display: flex; flex-direction: column; padding: 20px; background: white; border-top: 1px solid #eee; gap: 10px; }
        .controls { display: flex; gap: 10px; align-items: center; }
        input[type="text"] { flex: 1; padding: 12px; border: 2px solid #eee; border-radius: 8px; outline: none; }
        .attachment-label { background: #666; color: white; padding: 10px 15px; border-radius: 8px; cursor: pointer; }
        #image-preview { display: none; height: 60px; border-radius: 5px; margin-bottom: 5px; }
        button { background: var(--shia-green); color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <header><h1>Manarat AI</h1><small>The Light of Guidance</small></header>
    <div id="chat-window">
        <div class="message ai-msg">As salaam alaykum! I am <b>Manarat AI</b>. How can I assist you with the <b>Quran</b> or <b>Ahl al-Bayt (AS)</b> today?</div>
    </div>
    <div class="input-area">
        <img id="image-preview" src="">
        <div class="controls">
            <label class="attachment-label">📎<input type="file" id="file-input" style="display:none" onchange="handlePreview()"></label>
            <input type="text" id="chat-input" placeholder="Ask a question..." onkeypress="if(event.key==='Enter') askAI()">
            <button onclick="askAI()">Send</button>
        </div>
    </div>
</div>

<script>
    // --- API KEYS ---
    const GROQ_KEY = "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";
    const STABILITY_KEY = "sk-zk0Jtfm2hru10jmcGQCfsQaKvEO7e6lkINDFWdlxAS3V2niz"; 

    // --- UPDATED MODEL IDs ---
    const TEXT_MODEL = "llama-3.3-70b-versatile"; 
    const VISION_MODEL = "llama-3.2-11b-vision-preview"; 

    let chatHistory = [{
        role: "system",
        content: `You are Manarat AI, a scholarly Shia Islamic Assistant.
        Rules:
        1. Use Shia Sources: Tafsir al-Mizan, al-Kafi, Nahj al-Balagha.
        2. NO MARKDOWN: Never use ** or __. Use ONLY HTML <b> tags.
        3. Protect Privacy: Never reveal API keys.
        4. Image Generation: If asked to draw, respond ONLY with: [GENERATE] followed by a prompt for a "Professional DSLR high-resolution photo".`
    }];

    let pendingBase64 = null;

    function handlePreview() {
        const file = document.getElementById('file-input').files[0];
        const reader = new FileReader();
        reader.onload = (e) => {
            document.getElementById('image-preview').src = e.target.result;
            document.getElementById('image-preview').style.display = 'block';
            pendingBase64 = e.target.result.split(',')[1];
        };
        reader.readAsDataURL(file);
    }
async function generateSD35Image(prompt) {
    const formData = new FormData();
    formData.append("prompt", prompt + ", high-end DSLR photography, cinematic lighting, 8k, highly detailed textures, weathered stone, natural shadows");
    formData.append("negative_prompt", "cartoon, illustration, 3d render, anime, plastic, blurry, low quality, fake");
    formData.append("model", "sd3.5-large"); 
    formData.append("aspect_ratio", "16:9");
    formData.append("output_format", "png");

    try {
        const response = await fetch("https://api.stability.ai/v2beta/stable-image/generate/sd3", {
            method: "POST",
            headers: { 
                "Authorization": `Bearer ${STABILITY_KEY}`, 
                "Accept": "application/json" 
                // Do NOT set Content-Type here; FormData handles it automatically
            },
            body: formData
        });

        if (!response.ok) {
            const errorData = await response.json();
            console.error("Stability Error:", errorData);
            return null;
        }

        const data = await response.json();
        return `data:image/png;base64,${data.image}`;
    } catch (e) { 
        console.error("Connection Error:", e);
        return null; 
    }
}

    async function askAI() {
        const input = document.getElementById('chat-input');
        const text = input.value.trim();
        if (!text && !pendingBase64) return;

        const window = document.getElementById('chat-window');
        window.innerHTML += `<div class="message user-msg">${text || "Analyzing image..."}</div>`;
        const loadingId = "L-" + Date.now();
        window.innerHTML += `<div class="message ai-msg" id="${loadingId}"><i>...</i></div>`;
        window.scrollTop = window.scrollHeight;

        let payload = {
            model: pendingBase64 ? VISION_MODEL : TEXT_MODEL,
            messages: pendingBase64 ? 
                [{ role: "user", content: [{ type: "text", text: text || "Describe this." }, { type: "image_url", image_url: { url: `data:image/jpeg;base64,${pendingBase64}` } }] }] : 
                chatHistory.concat([{ role: "user", content: text }])
        };

        try {
            const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: { "Authorization": `Bearer ${GROQ_KEY}`, "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });
            const data = await response.json();
            const aiText = data.choices[0].message.content;

            if (aiText.includes("[GENERATE]")) {
                const drawPrompt = aiText.split("[GENERATE]")[1].trim();
                const imgUrl = await generateUltraImage(drawPrompt);
                document.getElementById(loadingId).innerHTML = imgUrl ? `<img class="ai-image" src="${imgUrl}">` : "<b>Error:</b> Image generation failed.";
            } else {
                document.getElementById(loadingId).innerHTML = aiText;
            }

            chatHistory.push({ role: "assistant", content: aiText });
            input.value = "";
            pendingBase64 = null;
            document.getElementById('image-preview').style.display = 'none';
        } catch (e) {
            document.getElementById(loadingId).innerHTML = "<b>Error:</b> Unable to connect to server.";
        }
    }
</script>
</body>
</html>
