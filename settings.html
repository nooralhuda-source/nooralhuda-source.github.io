<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Noor Al Huda — Settings</title>
  <link rel="stylesheet" href="style.css">
  <style>
/* Shared tokens (match hadiths-home.html) */
:root{
  --green:#276540;
  --bg:#f8fafb;
  --text:#1f2937;
  --muted:#6b7280;
  --card:#fff;
  --border:#e5e7eb;
  --radius:16px;
  --shadow-sm:0 4px 12px rgba(0,0,0,0.08);
  --shadow-md:0 10px 32px rgba(0,0,0,0.12);
  --transition:all .3s cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system, BlinkMacSystemFont, "SF Pro Display","Nunito",sans-serif;
  background:var(--bg); color:var(--text); line-height:1.6;
  padding-top:3.5rem; transition:background .3s,color .3s;
}

/* header / nav (consistent with other pages) */
header{
  position:fixed;top:0;left:0;width:100%;display:flex;align-items:center;justify-content:space-between;
  padding:.75rem 1.25rem;background:rgba(19,111,60,0.92);color:#fff;backdrop-filter:blur(14px) saturate(160%);
  box-shadow:var(--shadow-sm);z-index:1200;
}
.brand h1{font-size:1.25rem;font-weight:700;margin:0}
.brand a{color:inherit;text-decoration:none}
.hamburger{
  font-size:1.4rem;background:transparent;color:#fff;border:0;padding:.15rem .7rem;border-radius:8px;
  cursor:pointer;backdrop-filter:blur(6px);box-shadow:0 4px 10px rgba(0,0,0,0.08);
}
.hamburger:focus{outline:2px solid rgba(255,255,255,.12)}

/* slide nav */
#mainNav{
  position:fixed;top:0;right:-240px;width:220px;height:100%;padding:1.75rem;background:rgba(19,111,60,0.96);
  display:flex;flex-direction:column;gap:1rem;border-radius:0 0 0 20px;transition:right .35s ease,opacity .25s;
  opacity:0;pointer-events:none;z-index:1150;
}
#mainNav.open{right:0;opacity:1;pointer-events:auto}
#mainNav a{background:#fff;color:var(--green);padding:.6rem .9rem;border-radius:12px;text-decoration:none;font-weight:600;box-shadow:0 4px 12px rgba(0,0,0,.06)}
#mainNav a:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(0,0,0,.12)}

/* main card */
main{max-width:760px;margin:6.25rem auto;padding:2rem;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow-md)}
h2{text-align:center;margin-bottom:1rem;color:var(--green);font-size:1.25rem}

/* settings row */
.setting{display:flex;align-items:center;justify-content:space-between;padding:.75rem 0;border-bottom:1px dashed var(--border)}
.setting:last-of-type{border-bottom:none}
.setting label{display:flex;align-items:center;gap:.6rem;color:var(--text);font-weight:600}
.controls{display:flex;align-items:center;gap:.6rem}

/* form controls */
select,input[type="range"],input[type="checkbox"],button{
  border:1px solid var(--border);background:var(--card);color:var(--text);padding:.45rem .6rem;border-radius:10px;
  font-size:0.95rem;
}
.range-inline{width:160px}
.switch{width:44px;height:26px;border-radius:999px;background:#f1f5f9;position:relative;border:1px solid var(--border);cursor:pointer}
.switch .knob{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.08);transition:left .18s}
.switch.on{background:var(--green);border-color:rgba(0,0,0,0.06)}
.switch.on .knob{left:21px}

/* small helper */
.small{font-size:.9rem;color:var(--muted)}

/* footer */
.footer{text-align:center;margin-top:1.5rem;color:var(--muted);font-size:.9rem}

/* dark */
body.dark-mode{--bg:#0f172a;--text:#f9fafb;--muted:#94a3b8;--card:#1e293b;--border:#334155}
body.dark-mode header{background:rgba(18,90,47,0.95)}
@media(max-width:640px){main{margin:5.25rem 1rem;padding:1rem}}
theme-toggle {
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  font-weight: 600;
  font-size: 1.1rem;
  margin: 1.5rem 0;
  color: var(--text);
}

.theme-toggle input {
  display: none;
}

.toggle-slider {
  width: 50px;
  height: 26px;
  background: #cbd5e1;
  border-radius: 20px;
  position: relative;
  transition: background 0.3s;
}

.toggle-slider::before {
  content: "";
  position: absolute;
  width: 22px;
  height: 22px;
  background: white;
  border-radius: 50%;
  top: 2px;
  left: 2px;
  transition: transform 0.3s;
}

#darkToggle:checked + .toggle-slider {
  background: #276540;
}

#darkToggle:checked + .toggle-slider::before {
  transform: translateX(24px);
}
  </style>
</head>
<body>
  <header>
    <div class="brand"><h1><a href="index.html">Noor Al Huda</a></h1></div>
    <button class="hamburger" id="hamburger" aria-label="Open menu" aria-expanded="false">☰</button>
  </header>

  <nav id="mainNav" aria-hidden="true">
    <a href="quran.html">Quran</a>
    <a href="duas.html">Duas</a>
    <a href="hadiths-home.html">Hadiths</a>
    <a href="calendar.html">Calendar</a>
    <a href="salah.html">Salah</a>
    <a href="shiatube/index.html">ShiaTube</a>
    <a href="index.html">Home</a>
    <a href="settings.html" aria-current="page">Settings</a>
  </nav>

  <main role="main" aria-labelledby="settingsTitle">
    <h2 id="settingsTitle">Settings</h2>

    <div class="setting">
      <label for="darkModeToggle">Dark Mode</label>
      <div class="controls">
        <div id="darkSwitch" class="switch" role="switch" aria-checked="false" tabindex="0">
          <span class="knob"></span>
        </div>
      </div>
    </div>
<label class="theme-toggle">
  <input type="checkbox" id="darkToggle">
  <span class="toggle-slider"></span>
  <span class="toggle-text">Dark Mode</span>
</label>
    <div class="setting">
      <label for="citySelect">City</label>
      <div class="controls">
        <select id="citySelect" aria-label="Select city">
          <option value="London">London, UK</option>
          <option value="Bedford">Bedford, UK</option>
          <option value="Islamabad">Islamabad, Pakistan</option>
          <option value="Tehran">Tehran, Iran</option>
          <option value="Karbala">Karbala, Iraq</option>
          <option value="Najaf">Najaf, Iraq</option>
          <option value="Qom">Qom, Iran</option>
          <option value="Mashhad">Mashhad, Iran</option>
          <option value="Beirut">Beirut, Lebanon</option>
          <option value="Dearborn">Dearborn, US</option>
          <option value="Mumbai">Mumbai, India</option>
          <option value="Toronto">Toronto, Canada</option>
          <option value="New York">New York, US</option>
          <option value="Los Angeles">Los Angeles, US</option>
          <option value="Sydney">Sydney, Australia</option>
          <option value="Cairo">Cairo, Egypt</option>
          <option value="Riyadh">Riyadh, Saudi Arabia</option>
          <option value="Perth">Perth, Australia</option>
        </select>
        <button id="useMyLocation" type="button">📍 Use My Location</button>
      </div>
    </div>

    <div class="setting">
      <label for="fontSelect">Qur'anic Font</label>
      <div class="controls">
        <select id="fontSelect" aria-label="Quran font">
          <option value="uthmani">Uthmani</option>
          <option value="indopak">IndoPak</option>
          <option value="simple">Simple Arabic</option>
        </select>
      </div>
    </div>

    <div class="setting">
      <label for="fontSizeRange">Font Size</label>
      <div class="controls">
        <input id="fontSizeRange" class="range-inline" type="range" min="14" max="28" step="1" />
        <div id="fontSizeValue" class="small" aria-live="polite">16px</div>
      </div>
    </div>

    <div class="setting">
      <label>Enable Adhan</label>
      <div class="controls">
        <input id="adhanToggle" type="checkbox" />
        <input id="adhanVolume" class="range-inline" type="range" min="0" max="1" step="0.05" />
      </div>
    </div>

    <div style="text-align:center;margin-top:1.25rem;">
      <button id="signInBtn" type="button">Sign In</button>
    </div>

    <div class="footer">© 2025 Noor Al Huda</div>
  </main>

  <script src="global.js"></script>
  <script>
/* single init, cleaned and consistent with other pages */
document.addEventListener('DOMContentLoaded', () => {
  const hamburger = document.getElementById('hamburger');
  const mainNav = document.getElementById('mainNav');

  const darkSwitch = document.getElementById('darkSwitch');
  const citySelect = document.getElementById('citySelect');
  const fontSelect = document.getElementById('fontSelect');
  const fontSizeRange = document.getElementById('fontSizeRange');
  const fontSizeValue = document.getElementById('fontSizeValue');
  const adhanToggle = document.getElementById('adhanToggle');
  const adhanVolume = document.getElementById('adhanVolume');
  const useMyLocationBtn = document.getElementById('useMyLocation');
  const signInBtn = document.getElementById('signInBtn');

  // Hamburger behavior
  hamburger.addEventListener('click', (ev) => {
    ev.stopPropagation();
    const open = mainNav.classList.toggle('open');
    hamburger.setAttribute('aria-expanded', open ? 'true' : 'false');
    mainNav.setAttribute('aria-hidden', open ? 'false' : 'true');
  });
  document.addEventListener('click', (ev) => {
    if (!mainNav.classList.contains('open')) return;
    if (mainNav.contains(ev.target) || hamburger.contains(ev.target)) return;
    mainNav.classList.remove('open');
    hamburger.setAttribute('aria-expanded','false');
    mainNav.setAttribute('aria-hidden','true');
  });

  // Theme helper
  function applyTheme(isDark){
    if(isDark) document.body.classList.add('dark-mode');
    else document.body.classList.remove('dark-mode');
  }

  // Restore saved Settings (global Settings expected from global.js)
  try {
    if(window.Settings){
      applyTheme(Settings.theme === 'dark');
      // populate controls safely
      if(Settings.place) citySelect.value = Settings.place;
      if(Settings.quranFont) fontSelect.value = Settings.quranFont;
      fontSizeRange.value = Settings.fontSize || 16;
      fontSizeValue.textContent = (Settings.fontSize || 16) + 'px';
      adhanToggle.checked = !!Settings.adhanEnabled;
      adhanVolume.value = Settings.adhanVolume ?? 0.6;
      // dark switch UI
      if(Settings.theme === 'dark') darkSwitch.classList.add('on'), darkSwitch.setAttribute('aria-checked','true');
      else darkSwitch.classList.remove('on'), darkSwitch.setAttribute('aria-checked','false');
    } else {
      // sensible defaults
      fontSizeRange.value = 16;
      fontSizeValue.textContent = '16px';
      adhanVolume.value = 0.6;
    }
  } catch (e){ console.warn(e) }

  // Interactions
  darkSwitch.addEventListener('click', () => {
    const on = !darkSwitch.classList.contains('on');
    darkSwitch.classList.toggle('on', on);
    darkSwitch.setAttribute('aria-checked', on ? 'true' : 'false');
    applyTheme(on);
    if(window.Settings) Settings.theme = on ? 'dark' : 'light';
    localStorage.setItem('theme', on ? 'dark' : 'light');
  });

  // keyboard toggle
  darkSwitch.addEventListener('keydown', (e) => { if(e.key === 'Enter' || e.key === ' ') { e.preventDefault(); darkSwitch.click(); } });

  citySelect.addEventListener('change', (e) => { if(window.Settings) Settings.place = e.target.value; });

  fontSelect.addEventListener('change', (e) => { if(window.Settings) Settings.quranFont = e.target.value; });

  fontSizeRange.addEventListener('input', (e) => {
    const v = e.target.value;
    fontSizeValue.textContent = v + 'px';
    if(window.Settings) Settings.fontSize = v;
  });

  adhanToggle.addEventListener('change', (e) => { if(window.Settings) Settings.adhanEnabled = e.target.checked; });
  adhanVolume.addEventListener('input', (e) => { if(window.Settings) Settings.adhanVolume = e.target.value; });

  useMyLocationBtn.addEventListener('click', async () => {
    if(!navigator.geolocation) return alert('Browser does not support location.');
    useMyLocationBtn.disabled = true;
    try {
      navigator.geolocation.getCurrentPosition(async pos => {
        const { latitude, longitude } = pos.coords;
        const res = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${latitude}&lon=${longitude}&format=json`);
        const data = await res.json();
        const city = data.address.city || data.address.town || data.address.village || data.address.county || 'Unknown';
        if(confirm(`Detected: ${city}. Use this?`)){
          if (![...citySelect.options].some(o=>o.value === city)) {
            const opt = document.createElement('option'); opt.value = city; opt.textContent = city; citySelect.appendChild(opt);
          }
          citySelect.value = city;
          if(window.Settings) Settings.place = city;
          alert(`Location set to ${city}`);
        }
        useMyLocationBtn.disabled = false;
      }, () => { alert('Location permission denied.'); useMyLocationBtn.disabled = false; });
    } catch(err){ console.error(err); useMyLocationBtn.disabled = false; alert('Failed to detect location.'); }
  });

  signInBtn.addEventListener('click', () => { window.location.href = 'login.html'; });

  // initialize simple theme from localStorage if Settings not present
  if(!window.Settings){
    const saved = localStorage.getItem('theme');
    if(saved === 'dark') applyTheme(true);
  }
});
  </script>
</body>
</html>
