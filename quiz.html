        :root {

            --secondary-green: #1a8049;

        * {

        body {

        .navbar {

            top: 0;

            border-bottom: 1px solid #eee;

        .logo {

        .hamburger {

            text-align: center;
            color: white;

        }

        .page-header::before {

            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            animation: patternMove 60s linear infinite;
            opacity: 0.6;
        }

        @keyframes patternMove {
            0% { transform: translateX(0) translateY(0); }
            100% { transform: translateX(-30px) translateY(-30px); }
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
            position: relative;
            z-index: 2;
        }

        .header-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;

            color: white;
            padding: 12px 24px;

            font-weight: 600;

        }

        .back-home:hover {

            transform: translateY(-2px);
        }

        .page-title {
            font-size: clamp(2rem, 5vw, 3rem);
            font-weight: 800;
            margin-bottom: 0.5rem;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .page-subtitle {
            font-size: clamp(1rem, 2vw, 1.2rem);
            opacity: 0.95;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 3rem 1.5rem;

            background: white;
            border-radius: 20px;
            padding: 2.5rem;
            box-shadow: var(--shadow-lg);
            margin-bottom: 2rem;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: var(--medium-gray);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 2rem;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary-green), var(--accent-gold));
            transition: width 0.3s ease;
        }

        .question-number {
            color: var(--primary-green);
            font-weight: 700;
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }

        .question-text {
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 2rem;
            line-height: 1.5;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .option {
            background: var(--light-gray);
            border: 2px solid var(--medium-gray);
            border-radius: 12px;
            padding: 1.25rem;
            cursor: pointer;
            transition: var(--transition);
            font-size: 1rem;
            text-align: left;
        }

        .option:hover {
            background: rgba(19, 111, 60, 0.05);
            border-color: var(--primary-green);
            transform: translateX(5px);
        }

        .option.selected {
            background: rgba(19, 111, 60, 0.1);
            border-color: var(--primary-green);
            font-weight: 600;
        }

        .option.correct {
            background: rgba(43, 147, 72, 0.1);
            border-color: #2b9348;
            color: #2b9348;
        }

        .option.incorrect {
            background: rgba(217, 83, 79, 0.1);
            border-color: #d9534f;
            color: #d9534f;
        }

        .quiz-actions {
            display: flex;
            justify-content: space-between;
            gap: 1rem;
            margin-top: 2rem;
        }

        .btn {

            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: var(--shadow-sm);
        }

        .btn-primary {
            background: var(--primary-green);
            color: white;
        }

        .btn-primary:hover {
            background: var(--secondary-green);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .btn-primary:disabled {
            background: var(--medium-gray);
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: var(--light-gray);
            color: var(--text-dark);
            border: 2px solid var(--medium-gray);
        }

        .btn-secondary:hover {
            background: var(--medium-gray);
        }

        .score-display {
            display: none;
            text-align: center;
        }

        .score-circle {
            width: 200px;
            height: 200px;
            margin: 2rem auto;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary-green), var(--accent-gold));

            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-xl);
        }

        .score-inner {
            width: 180px;
            height: 180px;
            background: white;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .score-number {
            font-size: 3rem;
            font-weight: 800;
            color: var(--primary-green);
        }

        .score-label {
            font-size: 1rem;
            color: var(--text-light);
            margin-top: 0.5rem;
        }

        .score-message {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-dark);
            margin: 2rem 0 1rem;
        }

        .score-details {
            background: var(--light-gray);
            border-radius: 12px;
            padding: 1.5rem;
            margin: 2rem 0;
        }

        .score-stat {
            display: flex;
            justify-content: space-between;
            padding: 0.75rem 0;
            border-bottom: 1px solid var(--medium-gray);
        }

        .score-stat:last-child {
            border-bottom: none;
        }

        .score-stat-label {
            color: var(--text-light);
        }

        .score-stat-value {
            font-weight: 600;
            color: var(--text-dark);
        }

        .restart-actions {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-top: 2rem;
        }

        @media (max-width: 768px) {
            .hamburger {
                display: block;
            }

            .nav-links {
                display: none;
                flex-direction: column;
                width: 100%;
                padding: 1rem 1.5rem;
                gap: 1.2rem;
                border-top: 1px solid #eee;
            }

            .nav-links.active {
                display: flex;
            }

            .quiz-card {
                padding: 1.5rem;
            }

            .question-text {
                font-size: 1.1rem;
            }

            .quiz-actions {
                flex-direction: column;
            }

            .score-circle {
                width: 160px;
                height: 160px;
            }

            .score-inner {
                width: 140px;
                height: 140px;
            }

            .score-number {
                font-size: 2.5rem;
            }
        }

        @media (min-width: 769px) {
            .navbar {
                display: flex;
                align-items: center;
                justify-content: space-between;
            }

            .nav-container {
                display: flex;
                align-items: center;
                gap: 1rem;
            }

            .nav-links {
                display: flex;
                align-items: center;
                gap: 2.5rem;
                padding-right: 2rem;

        .scroll-progress {
            position: fixed;
            top: 0;
            left: 0;
            width: 0%;
            height: 3px;
            background: linear-gradient(90deg, var(--accent-gold), var(--primary-green));
            z-index: 1001;
            transition: width 0.1s ease;
        }

        html {
            scroll-behavior: smooth;
        }

    <script>
       const QUESTIONS = [
    {
        question: "Which Imam is known as 'The Jewel of the Aal al-Muhammad' and was the youngest to attain the Imamate?",
        options: ["Imam Muhammad al-Taqi (AS)", "Imam Ali al-Naqi (AS)", "Imam Muhammad al-Mahdi (AJ)", "Imam Musa al-Kadhim (AS)"],

    },
    {
        question: "In the context of 'Usul al-Din', which principle distinguishes Twelver Shia theology from most Sunni schools of thought?",

        correct: 2
    },
    {
        question: "Who was the mother of the 12th Imam, Muhammad al-Mahdi (AJ)?",

    },
    {
        question: "What was the primary reason for the 'Sulh' (Treaty) of Imam Hassan (AS) with Muawiyah?",

    },

        question: "Which battle saw Imam Ali (AS) face the 'Kharijites' (the Seceders)?",

    },
    {
        question: "Who was the courageous sister of Imam Hussain (AS) who delivered the powerful sermon in Yazid's court?",

    {
        question: "Which Imam established the vast university of knowledge in Medina, producing over 4,000 students?",

        correct: 2
    },
    {
        question: "Which tragedy occurred on the 25th of Shawwal?",
        options: ["Martyrdom of Imam Jafar al-Sadiq (AS)", "Martyrdom of Imam Ali (AS)", "Martyrdom of Imam Musa al-Kadhim (AS)", "The event of Mubahala"],
        correct: 0
    },
    {
        question: "What is the significance of the event of Mubahala?",
        options: ["The victory of the Battle of Badr", "The spiritual challenge between the Prophet and the Christians of Najran", "The conquest of Mecca", "The change of Qibla"],
        correct: 1
    },
    {
        question: "Who is the 'Bab al-Hawa’ij' (Gate of Needs) known for his patience during long imprisonments?",

    },
    {
        question: "The 'Ziyarat Ashura' is attributed to which Imam?",

    },
    {

    },

        let currentQuestion = 0;
        let score = 0;
        let selectedAnswer = null;
        let dailyQuestions = [];
        let userAnswers = [];

        const quizContainer = document.getElementById('quizContainer');
        const questionNumber = document.getElementById('questionNumber');
        const questionText = document.getElementById('questionText');
        const optionsContainer = document.getElementById('optionsContainer');
        const progressFill = document.getElementById('progressFill');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const finalScore = document.getElementById('finalScore');
        const scoreMessage = document.getElementById('scoreMessage');
        const correctCount = document.getElementById('correctCount');
        const incorrectCount = document.getElementById('incorrectCount');
        const percentage = document.getElementById('percentage');
        const restartBtn = document.getElementById('restartBtn');

        function shuffleArray(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        function initQuiz() {
            dailyQuestions = shuffleArray(QUESTIONS).slice(0, 10);
            userAnswers = new Array(dailyQuestions.length).fill(null);
            currentQuestion = 0;
            score = 0;
            showQuestion();
        }

        function showQuestion() {
            const question = dailyQuestions[currentQuestion];
            questionNumber.textContent = `Question ${currentQuestion + 1} of ${dailyQuestions.length}`;
            questionText.textContent = question.question;
            
            optionsContainer.innerHTML = '';
            question.options.forEach((option, index) => {
                const optionDiv = document.createElement('div');
                optionDiv.className = 'option';
                optionDiv.textContent = option;
                
                if (userAnswers[currentQuestion] === index) {
                    optionDiv.classList.add('selected');
                }
                
                optionDiv.addEventListener('click', () => selectOption(index));
                optionsContainer.appendChild(optionDiv);
            });

            updateProgress();
            updateButtons();
        }

        function selectOption(index) {
            userAnswers[currentQuestion] = index;
            
            const options = optionsContainer.querySelectorAll('.option');
            options.forEach((opt, i) => {
                opt.classList.remove('selected');
                if (i === index) {
                    opt.classList.add('selected');
                }
            });
            
            updateButtons();
        }

        function updateProgress() {
            const progress = ((currentQuestion + 1) / dailyQuestions.length) * 100;
            progressFill.style.width = progress + '%';
        }

        function updateButtons() {
            prevBtn.disabled = currentQuestion === 0;
            
            if (currentQuestion === dailyQuestions.length - 1) {
                nextBtn.textContent = 'Finish';
            } else {
                nextBtn.textContent = 'Next →';
            }
            
            nextBtn.disabled = userAnswers[currentQuestion] === null;
        }

        function nextQuestion() {
            if (currentQuestion < dailyQuestions.length - 1) {
                currentQuestion++;
                showQuestion();
            } else {
                calculateScore();
                showFinalScore();
            }
        }

        function prevQuestion() {
            if (currentQuestion > 0) {
                currentQuestion--;
                showQuestion();
            }
        }

        function calculateScore() {
            score = 0;
            dailyQuestions.forEach((question, index) => {
                if (userAnswers[index] === question.correct) {
                    score++;
                }
            });
        }

        function showFinalScore() {
            quizContainer.style.display = 'none';
            document.getElementById('quizActions').style.display = 'none';
            scoreDisplay.style.display = 'block';
            document.querySelector('.restart-actions').style.display = 'flex';
            
            const total = dailyQuestions.length;
            const incorrect = total - score;
            const percent = Math.round((score / total) * 100);
            
            finalScore.textContent = `${score}/${total}`;
            correctCount.textContent = score;
            incorrectCount.textContent = incorrect;
            percentage.textContent = `${percent}%`;
            
            if (percent >= 90) {
                scoreMessage.textContent = 'Excellent! Outstanding knowledge! 🌟';
            } else if (percent >= 70) {
                scoreMessage.textContent = 'Great job! Well done! 👏';
            } else if (percent >= 50) {
                scoreMessage.textContent = 'Good effort! Keep learning! 📚';
            } else {
                scoreMessage.textContent = 'Keep studying! You can do better! 💪';
            }
        }

        function restartQuiz() {
            scoreDisplay.style.display = 'none';
            document.querySelector('.restart-actions').style.display = 'none';
            quizContainer.style.display = 'block';
            document.getElementById('quizActions').style.display = 'flex';
            initQuiz();
        }

        prevBtn.addEventListener('click', prevQuestion);
        nextBtn.addEventListener('click', nextQuestion);
        restartBtn.addEventListener('click', restartQuiz);

        window.addEventListener('scroll', () => {
            const scrolled = (window.scrollY / (document.documentElement.scrollHeight - window.innerHeight)) * 100;
            document.querySelector('.scroll-progress').style.width = scrolled + '%';
        });

        const hamburger = document.getElementById('hamburger');
        const navLinks = document.getElementById('navLinks');
        
        if (hamburger) {
            hamburger.addEventListener('click', (e) => {
                e.stopPropagation();
                navLinks.classList.toggle('active');
                hamburger.classList.toggle('active');
                hamburger.textContent = navLinks.classList.contains('active') ? '✕' : '☰';
            });

            document.addEventListener('click', (e) => {
                if (!navLinks.contains(e.target) && !hamburger.contains(e.target)) {
                    navLinks.classList.remove('active');
                    hamburger.classList.remove('active');
                    hamburger.textContent = '☰';
                }
            });

            navLinks.querySelectorAll('a').forEach(link => {
                link.addEventListener('click', () => {
                    navLinks.classList.remove('active');
                    hamburger.classList.remove('active');
                    hamburger.textContent = '☰';
                });
            });
        }

        initQuiz();
    </script>
