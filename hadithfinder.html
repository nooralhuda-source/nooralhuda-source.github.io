<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hadith Finder</title>
  <style>/* Base layout */
body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  background: #f6f7f9;
  color: #1f2933;
  max-width: 900px;
  margin: 40px auto;
  padding: 0 20px;
}

/* Title */
h2 {
  font-weight: 600;
  margin-bottom: 20px;
  color: #111827;
}

/* Input area */
textarea {
  width: 100%;
  min-height: 120px;
  padding: 14px;
  font-size: 15px;
  line-height: 1.6;
  border-radius: 6px;
  border: 1px solid #d1d5db;
  resize: vertical;
  background: #ffffff;
}

textarea:focus {
  outline: none;
  border-color: #2563eb;
}

/* Button */
button {
  margin-top: 12px;
  padding: 10px 18px;
  font-size: 14px;
  font-weight: 500;
  border-radius: 6px;
  border: none;
  background: #2563eb;
  color: #ffffff;
  cursor: pointer;
}

button:hover {
  background: #1e40af;
}

/* Answer box */
#answer {
  margin-top: 30px;
  padding: 20px;
  background: #ffffff;
  border-radius: 6px;
  border-left: 4px solid #2563eb;
  line-height: 1.7;
  white-space: pre-wrap;
}

/* Citations */
#citations {
  margin-top: 15px;
  font-size: 13px;
  color: #374151;
}

#citations a {
  color: #2563eb;
  text-decoration: none;
}

#citations a:hover {
  text-decoration: underline;
}

/* Error / loading state */
.loading {
  color: #6b7280;
  font-style: italic;
}
body {
  font-family: Arial, sans-serif;
  margin: 2rem;
}

#query {
  width: 60%;
  padding: 0.5rem;
}

#ask {
  padding: 0.5rem 1rem;
}

#answer {
  margin-top: 2rem;
  font-size: 1.1rem;
}

#citations {
  margin-top: 1rem;
  font-size: 0.9rem;
  color: gray;
}
</style>
</head>
<body>

<h1>Hadith Finder</h1>
<input type="number" id="numResults" placeholder="Number of results" min="1" max="50" value="10" style="width: 120px; margin-left: 10px;">

<input type="text" id="query" placeholder="Ask something..." />
<button id="ask">Search</button>

<div id="answer"></div>
<div id="citations"></div>

<script>
const askBtn = document.getElementById("ask");
const queryInput = document.getElementById("query");
const answerDiv = document.getElementById("answer");
const numResultsInput = document.getElementById("numResults");


// List all JSON files you have
const DATASETS = [
  "1.json",
  "2.json",
  "3.json",
  "4.json",
  "5.json",
  "6.json",
  "7.json",
  "8.json",
  "9.json",
  "10.json",
  "11.json",
  "12.json",
  "13.json",
  "14.json",
  "15.json",
  "16.json",
  "17.json",
  "18.json",
  "19.json",
  "20.json",
  "21.json",
  "22.json",
  "23.json",
  "24.json",
  "25.json",
  "26.json",
  "27.json",
  "28.json",
  "29.json",
  "30.json",
  "31.json",
  "32.json",
  "33.json",
  "34.json",
  "35.json",
  "36.json",
  "37.json",
  "38.json",
];

let allData = [];

// 1️⃣ Load all JSONs
async function loadData() {
  for (const path of DATASETS) {
    try {
      const res = await fetch(path);
      if (!res.ok) throw new Error(`Failed to load ${path}`);
      const data = await res.json();
      allData = allData.concat(data);
    } catch (err) {
      console.error(err);
    }
  }
  console.log("Loaded", allData.length, "records");
}

loadData();

// 2️⃣ Simple AI-like semantic search
function computeScore(entry, queryWords) {
  const text = (entry.englishText || entry.text || "").toLowerCase();
  let score = 0;

  // Word overlap
  queryWords.forEach(word => {
    if (text.includes(word)) score += 1;
  });

  // Boost sahih/hassan
  const grade = (entry.behbudiGrading || entry.majlisiGrading || "").trim();
  if (grade === "صحيح" || grade.toLowerCase() === "sahih") score += 2;
  else if (grade.toLowerCase() === "hassan") score += 1;

  return score;
}

// 3️⃣ Button click
// 3️⃣ Button click
askBtn.onclick = () => {
  const query = queryInput.value.trim().toLowerCase();
  if (!query) return;

  const queryWords = query.split(/\s+/);

  const maxResults = parseInt(numResultsInput.value) || 10;

  const results = allData
    .map(entry => ({ ...entry, score: computeScore(entry, queryWords) }))
    .filter(e => e.score > 0)
    .sort((a, b) => b.score - a.score)
    .slice(0, maxResults); // use dynamic number from input

  renderAnswer(results);
};


// 4️⃣ Render results with source
function renderAnswer(results) {
  answerDiv.innerHTML = "";

  if (!results.length) {
    answerDiv.textContent = "No results found.";
    return;
  }

  results.forEach((r, i) => {
    const p = document.createElement("p");
    p.innerHTML = `<strong>${i+1}.</strong> ${r.englishText || r.text} <br>
                   <em>Source: ${r.book || "Unknown"} — Volume ${r.volume || "-"} — Chapter: ${r.chapter || "-"} — Hadith #: ${r.id || "-"}</em>`;
    answerDiv.appendChild(p);
  });
}
</script>
</body>
</html>
