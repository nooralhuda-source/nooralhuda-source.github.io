<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Manarat AI – Shia Hadith Research</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Manarat AI – Shia Hadith Finder</h1>

<input type="password" id="apiKey" placeholder="OpenAI API key" style="width:300px;">
<br><br>

<input type="text" id="query" placeholder="Ask a question (e.g. Salah, Ghadir, Imamate)">
<input type="number" id="limit" value="8" min="1" max="25">
<button id="searchBtn">Search Sources</button>
<button id="explainBtn">AI Explanation</button>

<div id="status"></div>
<div id="results"></div>

<script src="app.js"></script>
</body>
</html>
