:root {

}

/* ─── DYNAMIC CARDS (Less Repetitive) ─── */
.surah-grid {

  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 1.5rem; margin: 2rem auto 4rem;

.surah-card {

      data-en="Explore Shia AI Models" 
      data-ar="استكشف نماذج الذكاء الاصطناعي الشيعية">
      Explore Shia AI Models
  </h2>
  
  <div class="search-container">
    <div class="surah-search">
      <input type="text" id="searchAI" placeholder="Search for an AI model...">
    </div>
  </div>

  <div class="surah-grid" id="aiGrid"></div>
</main>

<footer data-en="© 2025 Noor Al Huda — Powered by Shia AI Technology">
    © 2025 Noor Al Huda — Powered by Shia AI Technology
</footer>

<script>
const aiModels = [
    { 
        name_en: "Shia GPT",  
        desc_en: "Specialized in General Shia beliefs and practices.",
        href: "shiagpt.html",
        type: "General"
    },
    { 
        name_en: "Marja AI",  
        desc_en: "Specialized in Jurisprudence (Fiqh) and Laws of sistani for now.",
        href: "marja-ai.html",
        type: "Fiqh"
    },

];

document.addEventListener("DOMContentLoaded", () => {
    const savedLang = localStorage.getItem('userLang') || 'en';
    const savedTheme = localStorage.getItem("theme");
    applyThemeClass(savedTheme === "dark");
    
    renderAICards(savedLang);
    setupUI();
});

function renderAICards(lang) {
    const grid = document.getElementById("aiGrid");
    if (!grid) return;
    grid.innerHTML = "";
    
    aiModels.forEach(model => {
        const card = document.createElement("div");
        card.className = "surah-card";

        const title = lang === 'ar' ? model.name_ar : model.name_en;
        const sub = model.desc_en;

        card.innerHTML = `
            <div>
                <h3>${title}</h3>
                <p>${sub}</p>
            </div>
            <span class="ai-badge">${model.type}</span>
        `;
        card.onclick = () => window.location.href = model.href;
        grid.appendChild(card);
    });
}

function setupUI() {
    const mainNav = document.getElementById("mainNav");
    const hamburger = document.querySelector(".hamburger");
    const searchInput = document.getElementById("searchAI");

    hamburger.onclick = (e) => {
        e.stopPropagation();
        mainNav.classList.toggle("open");
    };

    document.onclick = (e) => {
        if (!mainNav.contains(e.target) && !hamburger.contains(e.target))
            mainNav.classList.remove("open");
    };

    if (searchInput) {
        searchInput.oninput = (e) => {
            const q = e.target.value.toLowerCase();
            document.querySelectorAll(".surah-card").forEach(card => {
                card.style.display = card.textContent.toLowerCase().includes(q) ? "" : "none";
            });
        };
    }
}

function applyThemeClass(isDark) {
    document.body.classList.toggle("dark-mode", isDark);
}
</script>
